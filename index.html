// ── GESTION MULTI-ANNÉES & CONSTANTES DYNAMIQUES ─────────────────────────────
const ANNEES_SCOLAIRES=['2024-2025','2025-2026','2026-2027','2027-2028','2028-2029','2029-2030'];
const CURRENT_YEAR_KEY='gestiolys_current_year';
const STORAGE_KEY_PREFIX='gestiolys_';
const STORAGE_KEY_SUFFIX='_v1';
const BACKUPS_KEY='gestiolys_backups_v2';

function getCurrentAnnee(){
  return localStorage.getItem(CURRENT_YEAR_KEY)||'2026-2027';
}
function setCurrentAnnee(a){
  localStorage.setItem(CURRENT_YEAR_KEY,a);
}
function storageKeyForAnnee(a){
  return STORAGE_KEY_PREFIX+a.replace('-','')+STORAGE_KEY_SUFFIX;
}
// Dynamic globals — set by App on mount
let ANNEE=getCurrentAnnee();
let STORAGE_KEY=storageKeyForAnnee(ANNEE);

// ── BACKUPS ───────────────────────────────────────────────────────────────────
function loadBackups(){try{const r=localStorage.getItem(BACKUPS_KEY);if(r)return JSON.parse(r);}catch(e){}return[];}
function saveBackup(state,annee,label){
  const backups=loadBackups();
  const entry={id:uid(),date:new Date().toISOString(),annee,label:label||`Sauvegarde auto`,data:state};
  backups.unshift(entry);
  const kept=backups.slice(0,20); // max 20 backups in localStorage
  try{localStorage.setItem(BACKUPS_KEY,JSON.stringify(kept));}catch(e){
    // si trop volumineux, garder les 5 derniers
    try{localStorage.setItem(BACKUPS_KEY,JSON.stringify(kept.slice(0,5)));}catch(e2){}
  }
  return entry;
}
function deleteBackup(id){
  const kept=loadBackups().filter(b=>b.id!==id);
  try{localStorage.setItem(BACKUPS_KEY,JSON.stringify(kept));}catch(e){}
  return kept;
}

// ── BACKUP VIEW ───────────────────────────────────────────────────────────────
function BackupsView({state,anneeActive,onRestored}){
  const[backups,setBackups]=useState(loadBackups);
  const[confirm,setConfirm]=useState(null);
  const[uploadMsg,setUploadMsg]=useState('');
  const fileRef=useRef(null);

  function doDownload(){
    const entry={date:new Date().toISOString(),annee:anneeActive,version:'GestioLys-v2',data:state};
    const blob=new Blob([JSON.stringify(entry,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`GestioLys_${anneeActive.replace('-','')}_${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);
  }
  function doSaveLocal(label){
    const entry=saveBackup(state,anneeActive,label||`Sauvegarde ${new Date().toLocaleDateString('fr-BE')}`);
    setBackups(loadBackups());
  }
  function doRestore(backup){
    setConfirm({
      message:`Restaurer la sauvegarde "${backup.label}" (${new Date(backup.date).toLocaleString('fr-BE')}) pour l'année ${backup.annee} ? Les données actuelles seront écrasées.`,
      onConfirm:()=>{
        // Save current as backup first
        saveBackup(state,anneeActive,'Avant restauration — auto');
        // Set year if different
        if(backup.annee!==anneeActive){setCurrentAnnee(backup.annee);}
        onRestored(backup.data,backup.annee);
        setBackups(loadBackups());
        setConfirm(null);
      }
    });
  }
  function doDeleteBackup(id){
    setBackups(deleteBackup(id));
  }
  function handleUpload(file){
    if(!file)return;
    const r=new FileReader();
    r.onload=e=>{
      try{
        const parsed=JSON.parse(e.target.result);
        if(!parsed.data||!parsed.data.profs)throw new Error('Format de sauvegarde invalide');
        setConfirm({
          message:`Restaurer le fichier "${file.name}" (année ${parsed.annee||'inconnue'}, ${new Date(parsed.date).toLocaleString('fr-BE')}) ?`,
          onConfirm:()=>{
            saveBackup(state,anneeActive,'Avant import fichier — auto');
            if(parsed.annee&&parsed.annee!==anneeActive)setCurrentAnnee(parsed.annee);
            onRestored(parsed.data,parsed.annee||anneeActive);
            setBackups(loadBackups());
            setConfirm(null);
            setUploadMsg('Restauration réussie !');
            setTimeout(()=>setUploadMsg(''),3000);
          }
        });
      }catch(err){setUploadMsg('Erreur : '+err.message);}
    };
    r.readAsText(file);
  }

  return <div className="page">
    <div className="page-header">
      <div><div className="page-title">Sauvegardes</div><div className="page-subtitle">Points de restauration — Année {anneeActive}</div></div>
      <div style={{display:'flex',gap:7}}>
        <button className="btn btn-success" onClick={doDownload}><Icon d={I.download}/>Télécharger JSON</button>
        <button className="btn btn-primary" onClick={()=>doSaveLocal()}><Icon d={I.check}/>Sauver maintenant</button>
      </div>
    </div>

    {/* Télécharger / Uploader */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
      <div className="card">
        <h3 style={{fontSize:13,fontWeight:700,marginBottom:8}}><Icon d={I.download} size={14}/> Exporter une sauvegarde</h3>
        <p style={{fontSize:12,color:'var(--gray-500)',marginBottom:10}}>Télécharge un fichier .json avec toutes les données de l'année {anneeActive}. Gardez ce fichier en lieu sûr (clé USB, cloud…).</p>
        <button className="btn btn-success" onClick={doDownload} style={{width:'100%',justifyContent:'center'}}><Icon d={I.download}/>Télécharger sauvegarde .json</button>
      </div>
      <div className="card">
        <h3 style={{fontSize:13,fontWeight:700,marginBottom:8}}><Icon d={I.upload} size={14}/> Importer une sauvegarde</h3>
        <p style={{fontSize:12,color:'var(--gray-500)',marginBottom:10}}>Restaure les données depuis un fichier .json précédemment exporté. Une sauvegarde automatique est créée avant la restauration.</p>
        {uploadMsg&&<div className="alert" style={{background:uploadMsg.startsWith('Err')?'var(--red-light)':'var(--green-light)',color:uploadMsg.startsWith('Err')?'var(--red)':'var(--green)',border:'none',marginBottom:8,fontSize:12}}>{uploadMsg}</div>}
        <button className="btn btn-secondary" onClick={()=>fileRef.current.click()} style={{width:'100%',justifyContent:'center'}}><Icon d={I.upload}/>Charger fichier .json</button>
        <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={e=>handleUpload(e.target.files[0])}/>
      </div>
    </div>

    {/* Points de sauvegarde locaux */}
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <h3 style={{fontSize:13,fontWeight:700}}>Points de sauvegarde locaux ({backups.length}/20)</h3>
        <div style={{display:'flex',gap:6}}>
          <button className="btn btn-primary btn-sm" onClick={()=>{const l=window.prompt('Nom de la sauvegarde :','Sauvegarde manuelle');if(l)doSaveLocal(l);}}><Icon d={I.plus}/>Nouvelle</button>
        </div>
      </div>
      {backups.length===0?<div className="empty-state" style={{padding:'28px 0'}}><p>Aucune sauvegarde locale. Cliquez "Sauver maintenant" pour créer un point de restauration.</p></div>:
      <div className="table-container"><table>
        <thead><tr><th>Date</th><th>Label</th><th>Année</th><th>Enseignants</th><th>Attributions</th><th style={{width:100}}>Actions</th></tr></thead>
        <tbody>
          {backups.map(b=><tr key={b.id}>
            <td style={{fontSize:11.5,whiteSpace:'nowrap'}}>{new Date(b.date).toLocaleString('fr-BE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
            <td style={{fontWeight:500,fontSize:12.5}}>{b.label}</td>
            <td><span className="badge badge-blue">{b.annee}</span></td>
            <td style={{textAlign:'center',fontSize:12}}>{b.data?.profs?.length||0}</td>
            <td style={{textAlign:'center',fontSize:12}}>{b.data?.attributions?.length||0}</td>
            <td><div style={{display:'flex',gap:4}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>doRestore(b)} title="Restaurer" style={{color:'var(--green)'}}><Icon d={I.check} size={13}/></button>
              <button className="btn btn-ghost btn-sm" onClick={()=>{
                // Download this specific backup
                const blob=new Blob([JSON.stringify({date:b.date,annee:b.annee,version:'GestioLys-v2',data:b.data},null,2)],{type:'application/json'});
                const url=URL.createObjectURL(blob);const a=document.createElement('a');
                a.href=url;a.download=`GestioLys_${b.annee.replace('-','')}_${b.date.slice(0,10)}_${b.id}.json`;a.click();URL.revokeObjectURL(url);
              }} title="Télécharger cette sauvegarde"><Icon d={I.download} size={13}/></button>
              <button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>doDeleteBackup(b.id)} title="Supprimer"><Icon d={I.trash} size={13}/></button>
            </div></td>
          </tr>)}
        </tbody>
      </table></div>}
      <div style={{marginTop:10,fontSize:11,color:'var(--gray-400)',fontStyle:'italic'}}>Les sauvegardes locales sont stockées dans le navigateur (max 20). Pour une sécurité maximale, téléchargez régulièrement le fichier .json.</div>
    </div>
    {confirm&&<Confirm message={confirm.message} onConfirm={confirm.onConfirm} onCancel={()=>setConfirm(null)}/>}
  </div>;
}

// ── SÉLECTEUR D'ANNÉE SCOLAIRE ────────────────────────────────────────────────
function AnneeSelector({annee,onChangeAnnee,state}){
  const[open,setOpen]=useState(false);
  const[confirm,setConfirm]=useState(null);

  function switchTo(a){
    setConfirm({
      message:`Changer d'année scolaire vers ${a} ?\n\nLes données de ${annee} sont conservées. Vous pouvez revenir à tout moment.`,
      onConfirm:()=>{
        // Auto-save current year
        saveBackup(state,annee,`Changement vers ${a} — auto`);
        setCurrentAnnee(a);
        onChangeAnnee(a);
        setOpen(false);setConfirm(null);
      }
    });
  }
  function copyToNew(a){
    setConfirm({
      message:`Copier les données de ${annee} vers ${a} ?\n\nEnseignants et classes seront copiés. Attributions vides pour la nouvelle année.`,
      onConfirm:()=>{
        const newState={
          profs:state.profs.map(p=>({...p,_id:uid()})),
          classes:state.classes.map(c=>({...c,_id:uid()})),
          courses:state.courses.map(c=>({...c,_id:uid()})),
          categories:state.categories.map(c=>({...c,_id:uid()})),
          attributions:[],
        };
        const newKey=storageKeyForAnnee(a);
        saveState(newState,newKey);
        saveBackup(state,annee,`Avant copie vers ${a} — auto`);
        setCurrentAnnee(a);
        onChangeAnnee(a,newState);
        setOpen(false);setConfirm(null);
      }
    });
  }
  function hasData(a){
    try{const k=storageKeyForAnnee(a);return !!localStorage.getItem(k);}catch(e){return false;}
  }

  return <>
    <div style={{padding:'6px 10px',background:'#0f172a',borderBottom:'1px solid #334155',cursor:'pointer',display:'flex',alignItems:'center',justify:'space-between',gap:6}} onClick={()=>setOpen(o=>!o)}>
      <div>
        <div style={{fontSize:10,color:'#64748b',fontWeight:600,letterSpacing:.5}}>ANNÉE SCOLAIRE</div>
        <div style={{fontSize:13,fontWeight:700,color:'#38bdf8'}}>{annee} {open?'▲':'▼'}</div>
      </div>
    </div>
    {open&&<div style={{background:'#0f172a',borderBottom:'1px solid #334155',padding:'8px 6px'}}>
      {ANNEES_SCOLAIRES.map(a=>{
        const active=a===annee;const data=hasData(a);
        return <div key={a} style={{padding:'6px 8px',borderRadius:5,marginBottom:3,background:active?'#1d4ed8':'transparent',cursor:active?'default':'pointer'}}
          onClick={()=>!active&&switchTo(a)}>
          <div style={{display:'flex',alignItems:'center',justify:'space-between',gap:6}}>
            <span style={{fontSize:12,color:active?'#fff':data?'#94a3b8':'#475569',fontWeight:active?700:400}}>{a}</span>
            <div style={{display:'flex',gap:4,marginLeft:'auto'}}>
              {data&&!active&&<span style={{fontSize:9,background:'#334155',color:'#94a3b8',padding:'1px 4px',borderRadius:3}}>données</span>}
              {!data&&!active&&<button className="btn btn-ghost btn-sm" style={{color:'#64748b',padding:'1px 5px',fontSize:10}} onClick={e=>{e.stopPropagation();copyToNew(a);}}>Copier →</button>}
            </div>
          </div>
        </div>;
      })}
    </div>}
    {confirm&&<Confirm message={confirm.message} onConfirm={confirm.onConfirm} onCancel={()=>setConfirm(null)}/>}
  </>;
}

// ── ASSISTANT IA LOCAL ────────────────────────────────────────────────────────
function parseQuestion(q,state,annee){
  const lower=q.toLowerCase().trim();
  const profs=state.profs||[];
  const attrs=state.attributions||[];
  const classes=state.classes||[];
  const cats=state.categories||[];
  const circs=state.circulaires||[];
  const dep=state.depeche||{};
  const supps=(dep.ntpp&&dep.ntpp.supplements)||[];
  const retraits=(dep.ntpp&&dep.ntpp.retraits)||[];

  // --- Helpers enseignants ---
  function findProf(text){
    const t=text.toLowerCase();
    return profs.find(p=>t.includes((p.Nom||'').toLowerCase())||t.includes((p.Pseudo||'').toLowerCase())||(p.Nom||'').toLowerCase().split(' ').some(part=>part.length>3&&t.includes(part)));
  }
  function findClasse(text){
    const t=text.toLowerCase();
    return classes.find(c=>(c.CODEClasse||'').toLowerCase()===t.trim()||t.includes((c.CODEClasse||'').toLowerCase()));
  }
  function profHours(pseudo){
    const main=attrs.filter(a=>a['Pseudo ProfP']===pseudo);
    const repl=attrs.filter(a=>a['Pseudo ProfR']===pseudo);
    const totalMain=Math.round(main.reduce((s,a)=>s+sfloat(a["Nbre d'heure attribué"]),0)*10)/10;
    const totalRgpt=Math.round(main.reduce((s,a)=>s+sfloat(a.HRGPT),0)*10)/10;
    const totalRepl=Math.round(repl.reduce((s,a)=>s+sfloat(a.HRGPT),0)*10)/10;
    return{main,repl,totalMain,totalRgpt,totalRepl};
  }
  function formatAttrs(list){return list.map(a=>`  • ${a.Classe} — ${a['Libellé long']} : ${sfloat(a["Nbre d'heure attribué"])}h${sfloat(a.HRGPT)>0?' (HRGPT: '+sfloat(a.HRGPT)+'h)':''}`).join('\n');}

  // --- Helpers circulaires ---
  function fmtCirc(c){
    let s=`📋 **Circulaire n°${c.numero}**${c.permanent?' 📌':''} — ${c.titre}\n`;
    s+=`  • Année : ${c.annee==='permanent'?'Référence permanente':c.annee}${c.date?' | Date : '+c.date:''}\n`;
    if(c.description)s+=`  • ${c.description}\n`;
    if(c.tags&&c.tags.length>0)s+=`  • Thèmes : ${c.tags.join(', ')}\n`;
    if(c.url)s+=`  • 🔗 ${c.url}\n`;
    return s.trim();
  }
  function findCircByNum(text){const m=text.match(/\b(\d{4,5})\b/);if(!m)return null;return circs.find(c=>c.numero===m[1]);}
  function searchCircs(filter){
    return circs.filter(c=>{
      const all=(c.titre+' '+(c.description||'')+' '+(c.tags||[]).join(' ')+' '+c.numero).toLowerCase();
      return filter.split(' ').filter(w=>w.length>2).every(w=>all.includes(w));
    });
  }
  // Mots-clés → tags circulaires
  const CIRC_TAG_KW={ntpp:['ntpp','nttp','périodes-professeur','périodes professeur'],rlmo:['rlmo','religion','morale','laïque'],personnel:['personnel','recrutement','engagement','nomination','embauche'],formulaires:['formulaire','annexe','document officiel'],grilles:['grille horaire','grille','option groupée'],absences:['absence','congé','maladie','disponibilité'],remuneration:['rémunération','salaire','barème','pécule'],organisation:['organisation scolaire','calendrier'],pms:['pms','centre psycho','guidance'],integration:['intégration','int ']};

  // 1. Info générale sur un enseignant
  const prof=findProf(lower);
  if(prof&&(lower.includes('qui est')||lower.includes('info')||lower.includes('fiche')||lower.includes('renseigne'))){
    const{totalMain,totalRgpt}=profHours(prof.Pseudo);
    const noms=prof.nominations||[];
    const nomsStr=noms.length>1?noms.map((n,i)=>`  ${i+1}. ${n['Libellé Fonction']||'—'}${n.Vol?' ('+n.Vol+')':''}${n.Type&&n.Type!==prof.Type?' ['+( n.Type==='N'?'Nommé':n.Type==='T'?'Temp.':'Rempl.')+']':''}`).join('\n'):`  → ${prof['Libellé Fonction']||'—'}`;
    return `👤 **${prof.Nom}** (${prof.Pseudo})\n`+
      `• Nominations (${noms.length||1}) :\n${nomsStr}\n`+
      `• Type : ${prof.Type==='N'?'Nommé(e) définitif':prof.Type==='T'?'Temporaire':'Remplaçant(e)'} | Vol : ${prof.Vol||'—'} | Nb h : ${prof.nbreH||'—'}\n`+
      `• École : ${prof.Ecole||'—'} | Email : ${prof.Email||'—'}\n`+
      `• Diplôme : ${prof['Libellé Diplôme ou EU']||'—'}\n`+
      `• Total attribué : **${totalMain}h**${totalRgpt>0?' (HRGPT: '+totalRgpt+'h non comptab.)':''}`;
  }
  // 2. Fonction / nomination d'un enseignant
  if(prof&&(lower.includes('fonction')||lower.includes('nommé')||lower.includes('nommee')||lower.includes('statut')||lower.includes('nomination'))){
    const noms=prof.nominations||[];
    const nomsLines=noms.length>0?noms.map((n,i)=>`  ${i+1}. **${n['Libellé Fonction']||'—'}** — Vol: ${n.Vol||'—'} — ${n.Type==='N'?'Nommé(e)':n.Type==='T'?'Temporaire':'Remplaçant(e)'}${n['Libellé Diplôme ou EU']?' — 🎓 '+n['Libellé Diplôme ou EU']:''}`).join('\n'):`  1. ${prof['Libellé Fonction']||'non renseignée'}`;
    return `👤 **${prof.Nom}** (${prof.Pseudo})\n`+(noms.length>1?`🔖 **${noms.length} nominations** :\n${nomsLines}\n`:`• Fonction : **${prof['Libellé Fonction']||'non renseignée'}**\n• Type : **${prof.Type==='N'?'Nommé(e) définitif':prof.Type==='T'?'Temporaire':'Remplaçant(e)'}**\n`)+`• Vol : **${prof.Vol||'—'}** | Nb h : **${prof.nbreH||'—'}h** | Commentaire : ${prof['Commentaire Nomination']||'—'}`;
  }
  // 3. Heures d'un enseignant
  if(prof&&(lower.includes('heure')||lower.includes('charge')||lower.includes('attribu')||lower.includes('volume')||lower.includes('combien'))){
    const{main,repl,totalMain,totalRgpt,totalRepl}=profHours(prof.Pseudo);
    let resp=`⏱ **Heures de ${prof.Nom}** (${prof.Pseudo})\n• Vol contractuel : ${prof.Vol||'—'} (${prof.nbreH||'?'}h)\n• Total attribué : **${totalMain}h**\n`;
    if(totalRgpt>0)resp+=`• HRGPT (non comptab.) : ${totalRgpt}h\n`;
    if(totalRepl>0)resp+=`• Remplacements : ${totalRepl}h\n`;
    if(main.length>0)resp+=`\nCours (${main.length}) :\n${formatAttrs(main)}`;
    if(repl.length>0)resp+=`\nRemplacements :\n${repl.map(a=>`  • ${a.Classe} — ${a['Libellé long']} : ${sfloat(a.HRGPT)}h HRGPT`).join('\n')}`;
    if(main.length===0&&repl.length===0)resp+=`\nℹ Aucune attribution encodée.`;
    return resp;
  }
  // 4. Attributions / portefeuille d'un enseignant
  if(prof&&(lower.includes('attribu')||lower.includes('cours')||lower.includes('classe')||lower.includes('enseigne')||lower.includes('portefeuille'))){
    const{main,repl,totalMain}=profHours(prof.Pseudo);
    if(main.length===0&&repl.length===0)return `ℹ ${prof.Nom} n'a aucune attribution encodée pour ${annee}.`;
    let resp=`📋 **Attributions de ${prof.Nom}** — ${annee}\nTotal : ${totalMain}h\n\n`;
    if(main.length>0)resp+=`Cours principaux :\n${formatAttrs(main)}\n`;
    if(repl.length>0)resp+=`\nRemplacements :\n${repl.map(a=>`  • ${a.Classe} — ${a['Libellé long']} : ${sfloat(a.HRGPT)}h HRGPT`).join('\n')}`;
    return resp;
  }
  // 5. Diplôme d'un enseignant
  if(prof&&(lower.includes('diplôme')||lower.includes('diplome')||lower.includes('eu ')||lower.includes('formation'))){
    const noms=prof.nominations||[];
    const diploStr=noms.filter(n=>n['Libellé Diplôme ou EU']).map(n=>`  • ${n['Libellé Fonction']||'—'} → 🎓 ${n['Libellé Diplôme ou EU']}`).join('\n');
    return `🎓 **${prof.Nom}** (${prof.Pseudo})\n`+(diploStr?`Diplômes / EU par nomination :\n${diploStr}`:`• Diplôme / EU : **${prof['Libellé Diplôme ou EU']||'non renseigné'}**`);
  }
  // 6. Info sur une classe (enrichie avec filles/garçons/LM)
  const classe=findClasse(lower);
  if(classe){
    const cAttrs=attrs.filter(a=>a.Classe===classe.CODEClasse);
    const totalH=Math.round(cAttrs.reduce((s,a)=>s+sfloat(a["Nbre d'heure attribué"]),0)*10)/10;
    let resp=`🏫 **Classe ${classe.CODEClasse}**\n`+
      `• Option : ${classe['Nom Option']||'—'} | Année : ${classe.Année} | GP : ${classe.GP}\n`+
      `• Effectif : **${classe['Nbre Elev']||'—'} élèves**`;
    if(classe.Filles||classe.Garçons)resp+=` (♀ ${classe.Filles||0} filles / ♂ ${classe.Garçons||0} garçons)`;
    resp+='\n';
    if(classe.LM1||classe.LM2)resp+=`• LM1 : ${classe.LM1||'—'} | LM2 : ${classe.LM2||'—'}\n`;
    resp+=`• Cours attribués : ${cAttrs.length} | Total heures : ${totalH}h\n`;
    if(cAttrs.length>0)resp+=`\nCours :\n${cAttrs.map(a=>`  • ${a['Libellé long']} — ${a['Prof Principal']||'(non attribué)'} : ${sfloat(a["Nbre d'heure attribué"])}h`).join('\n')}`;
    return resp;
  }
  // 7. NTTP / Catégories
  if(lower.includes('nttp')||lower.includes('catégorie')||lower.includes('categorie')||lower.includes('heures restante')||lower.includes('reste')){
    const usedByCat={};
    attrs.forEach(a=>{const k=a['Catégorie heure']||'';usedByCat[k]=(usedByCat[k]||0)+sfloat(a["Nbre d'heure attribué"]);});
    let resp='📊 **État NTTP par catégorie**\n\n';
    cats.forEach(c=>{
      const key=Object.keys(usedByCat).find(k=>k&&catNum(k)===catNum(c.Catégorie))||'';
      const used=Math.round((usedByCat[key]||0)*10)/10;
      const total=sint(c.Total);const reste=Math.round((total-used)*10)/10;
      const pct=total>0?Math.round((used/total)*100):0;
      resp+=`${pct>100?'🔴 DÉPASSÉ':pct>90?'🟡 Attention':'🟢'} **${c.Catégorie.replace(/Catégorie\s+/i,'Cat.')}**\n`;
      resp+=`  NTTP: ${c.NTTP} | Dispo: ${total}h | Utilisé: ${used}h | Reste: ${reste}h (${pct}%)\n\n`;
    });
    return resp.trim();
  }
  // 8. Liste des enseignants
  if(lower.includes('liste')||(lower.includes('tous')||lower.includes('toutes'))&&lower.includes('enseignant')){
    const sorted=[...profs].sort((a,b)=>a.Nom.localeCompare(b.Nom));
    return `👥 **Enseignants (${profs.length})**\n`+sorted.map(p=>`  • ${p.Pseudo} — ${p.Nom} (${p.Type==='N'?'Nommé':p.Type==='T'?'Temp.':'Remp.'}) ${p.Vol?'| '+p.Vol:''}`).join('\n');
  }
  // 9. Stats globales / résumé
  if(lower.includes('statistique')||lower.includes('résumé')||lower.includes('bilan')||lower.includes('état général')||lower.includes('combien d\'enseignant')){
    const totalH=Math.round(attrs.reduce((s,a)=>s+sfloat(a["Nbre d'heure attribué"]),0)*10)/10;
    const profAvecAttr=new Set(attrs.map(a=>a['Pseudo ProfP']).filter(Boolean)).size;
    const totalDispo=cats.reduce((s,c)=>s+sint(c.Total),0);
    const totalSupp=supps.reduce((s,x)=>s+sint(x.valeur),0);
    const totalRetr=retraits.reduce((s,x)=>s+sint(x.valeur),0);
    return `📈 **Résumé GestioLys — ${annee}**\n`+
      `• Enseignants : ${profs.length} (${profAvecAttr} avec attributions)\n`+
      `• Classes : ${classes.length} | Cours référentiels : ${state.courses?.length||0}\n`+
      `• Attributions encodées : ${attrs.length} | Total heures : ${totalH}h\n`+
      `• NTTP organisable : ${totalDispo+totalSupp-totalRetr}h (${totalDispo}h net + ${totalSupp}h suppl. - ${totalRetr}h retraits)\n`+
      `• Circulaires : ${circs.length} (${circs.filter(c=>c.permanent).length} permanentes)`;
  }
  // 10. Circulaire par numéro (ex: "circulaire 9554", "circulaire n°10234")
  if(lower.match(/\b(circulaire|circ\.?)\s*n?°?\s*\d{4,5}/i)||(lower.includes('circulaire')&&lower.match(/\b\d{4,5}\b/))){
    const circ=findCircByNum(lower);
    if(circ)return fmtCirc(circ);
    const num=(lower.match(/\b(\d{4,5})\b/)||[])[1];
    return `❓ Circulaire n°${num||'?'} introuvable.\nCirculaires disponibles : ${circs.map(c=>'n°'+c.numero).join(', ')||'aucune'}.`;
  }
  // 11. Circulaires par thème / liste
  if(lower.includes('circulaire')||lower.includes('réglementation')||lower.includes('reglementation')||lower.includes('texte légal')||lower.includes('base légale')||lower.includes('liste des circ')||lower.includes('toutes les circ')){
    let filtered=[...circs];
    // filtre par tag
    let tagFound='';
    for(const[tag,kws]of Object.entries(CIRC_TAG_KW)){if(kws.some(kw=>lower.includes(kw))){tagFound=tag;break;}}
    if(tagFound)filtered=filtered.filter(c=>c.tags&&c.tags.includes(tagFound));
    // filtre temporel
    if(lower.includes('permanent')||lower.includes('permanente'))filtered=filtered.filter(c=>c.permanent);
    else if(lower.includes(annee)||lower.includes('cette année'))filtered=filtered.filter(c=>c.annee===annee||c.permanent);
    else if(lower.includes('nouvelle')||lower.includes('récente'))filtered=filtered.filter(c=>!c.permanent).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(filtered.length===0)return `ℹ Aucune circulaire trouvée${tagFound?' pour le thème "'+tagFound+'"':''}.`;
    if(filtered.length===1)return fmtCirc(filtered[0]);
    let resp=`📚 **Circulaires (${filtered.length})${tagFound?' — thème : '+tagFound:''}** :\n\n`;
    filtered.forEach((c,i)=>{resp+=fmtCirc(c);if(i<filtered.length-1)resp+='\n\n';});
    return resp;
  }
  // 12. Suppléments / retraits / total organisable
  if(lower.includes('supplément')||lower.includes('supplement')||lower.includes('total organisable')||lower.includes('nttp total')||lower.includes('encadrement différencié')||lower.includes('solidarité zonale')||lower.includes('retrait')||lower.includes('prélèvement zonal')||lower.includes('périodes complémentaires')||lower.includes('periodes compl')){
    const totalDispo=cats.reduce((s,c)=>s+sint(c.Total),0);
    const totalSupp=supps.reduce((s,x)=>s+sint(x.valeur),0);
    const totalRetr=retraits.reduce((s,x)=>s+sint(x.valeur),0);
    let resp=`📊 **NTTP & Suppléments** — ${dep.ntpp&&dep.ntpp.annee||annee}\n\n**NTTP net catégories : ${totalDispo}h**\n\n`;
    if(supps.length>0){resp+=`📈 **Suppléments (+${totalSupp}h) :**\n`;supps.forEach(x=>resp+=`  • [${x.code||'—'}] ${x.label} : **+${x.valeur}h**\n`);resp+='\n';}
    else resp+='📈 Aucun supplément enregistré.\n\n';
    if(retraits.length>0){resp+=`📉 **Retraits (-${totalRetr}h) :**\n`;retraits.forEach(x=>resp+=`  • [${x.code||'—'}] ${x.label} : **-${x.valeur}h**\n`);resp+='\n';}
    resp+=`🔵 **Total NTTP organisable : ${totalDispo+totalSupp-totalRetr}h**`;
    return resp;
  }
  // 13. Liste des classes
  if((lower.includes('liste')&&lower.includes('classe'))||(lower.includes('toutes')&&lower.includes('classe'))){
    const sorted=[...classes].sort((a,b)=>a.CODEClasse.localeCompare(b.CODEClasse));
    return `🏫 **Classes (${classes.length})**\n`+sorted.map(c=>`  • **${c.CODEClasse}** — ${c['Nom Option']||'—'} (${c['Nbre Elev']||'?'} él.${c.Filles?' ♀'+c.Filles:''}${c.Garçons?' ♂'+c.Garçons:''}${c.LM1?' | LM1:'+c.LM1.slice(0,2):''})`).join('\n');
  }
  // 14. Base légale RLMO
  if(lower.includes('rlmo')||lower.includes('religion')||lower.includes('morale laïque')||lower.includes('périodes religion')){
    const circRlmo=circs.filter(c=>c.tags&&c.tags.includes('rlmo'));
    let resp=`📖 **Base légale RLMO**\n• AR n°49 du 02/07/1982 (art. 12-13) — normes de création et dédoublement\n• Décret du 29/07/1992 — organisation enseignement secondaire (art. 22 §4)\n• Décret du 02/07/1990 — calcul NTTP (art. 7)\n\n**Calcul :** Groupes × 2 périodes × 0,98 = périodes RLMO\n`;
    if(dep.ntpp&&dep.ntpp.rlmoAnnee)resp+=`\nDonnées enregistrées : dépêche ${dep.ntpp.rlmoAnnee}`;
    if(circRlmo.length>0){resp+=`\n\n📚 Circulaires liées :\n`;circRlmo.forEach(c=>resp+=`  • n°${c.numero} — ${c.titre}\n`);}
    return resp;
  }
  // 15. Aide enrichie
  if(lower.includes('aide')||lower.includes('help')||lower.includes('que peux')||lower.includes('quoi')){
    return `🤖 **Assistant GestioLys — Ce que je sais faire :**\n\n`+
      `👤 **Enseignants** :\n`+
      `  • "Fiche de [nom/pseudo]" | "Nominations de [nom]"\n`+
      `  • "Combien d'heures a [nom] ?" | "Portefeuille de [nom]"\n`+
      `  • "Diplôme de [nom]" | "Liste de tous les enseignants"\n\n`+
      `🏫 **Classes** (ex: 1C.1) :\n`+
      `  • "Informations sur la classe 3P.1" | "Liste de toutes les classes"\n\n`+
      `📊 **NTTP** :\n`+
      `  • "État des catégories NTTP"\n`+
      `  • "Suppléments et total organisable"\n`+
      `  • "Encadrement différencié" | "Solidarité zonale"\n\n`+
      `📋 **Circulaires & réglementations** :\n`+
      `  • "Circulaire 9554" | "Circulaire n°10234"\n`+
      `  • "Circulaires sur le NTPP" | "Circulaires sur le RLMO"\n`+
      `  • "Circulaires permanentes" | "Nouvelles circulaires"\n`+
      `  • "Liste de toutes les circulaires"\n`+
      `  • "Base légale RLMO"\n\n`+
      `📈 **Stats** : "Résumé de l'année" | "Bilan général"`;
  }

  // Fallback — recherche par nom partiel ou mot-clé circulaire
  if(lower.length>2){
    // Cherche dans les circulaires
    const circFound=searchCircs(lower);
    if(circFound.length>0&&lower.length>4){
      if(circFound.length===1)return fmtCirc(circFound[0]);
      return `📚 **${circFound.length} circulaires trouvées :**\n\n`+circFound.map(fmtCirc).join('\n\n');
    }
    // Cherche enseignant
    const found=profs.filter(p=>(p.Nom||'').toLowerCase().includes(lower)||(p.Pseudo||'').toLowerCase().includes(lower));
    if(found.length===1){
      const p=found[0];const{totalMain}=profHours(p.Pseudo);
      const nbNoms=(p.nominations||[]).length;
      return `👤 **${p.Nom}** (${p.Pseudo})\n• Fonction : ${p['Libellé Fonction']||'—'} | Type : ${p.Type==='N'?'Nommé':'Temp.'} | Vol : ${p.Vol||'—'}${nbNoms>1?' | **'+nbNoms+' nominations**':''}\n• Total attribué : ${totalMain}h\nTapez "fiche" ou "aide" pour plus d'options.`;
    }
    if(found.length>1&&found.length<=6)return `Plusieurs enseignants :\n${found.map(p=>`  • ${p.Pseudo} — ${p.Nom}`).join('\n')}\n\nPrécisez le nom ou le pseudo.`;
  }
  return `❓ Je n'ai pas trouvé de réponse.\n\nTapez **"aide"** pour voir tout ce que je sais faire, ou précisez votre question (enseignant, classe, circulaire…).`;
}

];

function FloatingAssistant({state,annee}){
  const[open,setOpen]=useState(false);
  const[input,setInput]=useState('');
  const[messages,setMessages]=useState([{role:'assistant',text:`👋 Bonjour ! Je suis l'assistant GestioLys.\n\nJe peux vous aider avec les informations sur les enseignants, les attributions et les NTTP.\n\nTapez le nom d'un enseignant ou une question, ou tapez **"aide"** pour commencer.`}]);
  const bottomRef=useRef(null);
  const inputRef=useRef(null);

  useEffect(()=>{if(open&&bottomRef.current)bottomRef.current.scrollIntoView({behavior:'smooth'});},[messages,open]);
  useEffect(()=>{if(open&&inputRef.current)inputRef.current.focus();},[open]);

  function sendMsg(text){
    const q=(text||input).trim();if(!q)return;
    setMessages(m=>[...m,{role:'user',text:q}]);
    setInput('');
    setTimeout(()=>{
      const answer=parseQuestion(q,state,annee);
      setMessages(m=>[...m,{role:'assistant',text:answer}]);
    },120);
  }
  function formatText(t){
    // Bold: **text**
    return t.split('\n').map((line,i)=>{
      const parts=line.split(/(\*\*[^*]+\*\*)/g);
      return <div key={i} style={{marginBottom:line===''?6:2}}>{parts.map((p,j)=>p.startsWith('**')&&p.endsWith('**')?<strong key={j}>{p.slice(2,-2)}</strong>:<span key={j}>{p}</span>)}</div>;
    });
  }

  return <>
    {/* Floating button */}
    <div className="no-print" style={{position:'fixed',bottom:22,right:22,zIndex:500}}>
      {!open&&<button onClick={()=>setOpen(true)} style={{width:52,height:52,borderRadius:'50%',background:'linear-gradient(135deg,#2563eb,#7c3aed)',color:'#fff',border:'none',cursor:'pointer',boxShadow:'0 4px 16px rgba(37,99,235,.4)',fontSize:22,display:'flex',alignItems:'center',justifyContent:'center',transition:'transform .2s'}} onMouseEnter={e=>e.currentTarget.style.transform='scale(1.1)'} onMouseLeave={e=>e.currentTarget.style.transform=''} title="Assistant GestioLys">🤖</button>}
    </div>

    {/* Panel */}
    {open&&<div className="no-print" style={{position:'fixed',bottom:16,right:16,width:390,maxHeight:'75vh',background:'#fff',borderRadius:14,boxShadow:'0 8px 40px rgba(0,0,0,.2)',display:'flex',flexDirection:'column',zIndex:500,border:'1px solid var(--gray-200)'}}>
      {/* Header */}
      <div style={{padding:'11px 14px',background:'linear-gradient(135deg,#1e293b,#1e40af)',borderRadius:'14px 14px 0 0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:18}}>🤖</span>
          <div><div style={{fontSize:13,fontWeight:700,color:'#fff'}}>Assistant GestioLys</div><div style={{fontSize:10,color:'#94a3b8'}}>{annee} — {state.profs?.length||0} enseignants chargés</div></div>
        </div>
        <button onClick={()=>setOpen(false)} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:16,lineHeight:1}}>✕</button>
      </div>

      {/* Messages */}
      <div style={{flex:1,overflow:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:10,background:'#f8fafc'}}>
        {messages.map((m,i)=><div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
          <div style={{maxWidth:'88%',padding:'8px 11px',borderRadius:m.role==='user'?'12px 12px 2px 12px':'12px 12px 12px 2px',background:m.role==='user'?'#2563eb':'#fff',color:m.role==='user'?'#fff':'var(--gray-800)',fontSize:12.5,lineHeight:1.55,border:m.role==='assistant'?'1px solid var(--gray-200)':'none',boxShadow:m.role==='assistant'?'0 1px 3px rgba(0,0,0,.07)':'none',whiteSpace:'pre-wrap',fontFamily:'inherit'}}>
            {m.role==='assistant'?formatText(m.text):m.text}
          </div>
        </div>)}
        <div ref={bottomRef}/>
      </div>

      {/* Suggestions */}
      <div style={{padding:'6px 10px',background:'#f1f5f9',borderTop:'1px solid var(--gray-200)',display:'flex',gap:5,flexWrap:'wrap'}}>
        {SUGGESTIONS.slice(0,4).map(s=><button key={s} onClick={()=>sendMsg(s)} style={{background:'#fff',border:'1px solid var(--gray-200)',borderRadius:12,padding:'3px 8px',fontSize:10.5,cursor:'pointer',color:'var(--gray-600)',transition:'background .15s'}} onMouseEnter={e=>e.currentTarget.style.background='var(--blue-light)'} onMouseLeave={e=>e.currentTarget.style.background='#fff'}>{s}</button>)}
      </div>

      {/* Input */}
      <div style={{padding:'10px 12px',borderTop:'1px solid var(--gray-200)',display:'flex',gap:7,background:'#fff',borderRadius:'0 0 14px 14px'}}>
        <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}} placeholder="Posez votre question…" style={{flex:1,border:'1px solid var(--gray-200)',borderRadius:8,padding:'6px 10px',fontSize:12.5}}/>
        <button onClick={()=>sendMsg()} disabled={!input.trim()} style={{background:'#2563eb',color:'#fff',border:'none',borderRadius:8,padding:'6px 12px',cursor:'pointer',fontSize:13,fontWeight:600}} onMouseEnter={e=>e.currentTarget.style.background='#1e40af'} onMouseLeave={e=>e.currentTarget.style.background='#2563eb'}>↑</button>
      </div>
    </div>}
  </>;
}
// ── REDUCER ───────────────────────────────────────────────────────────────────
function reducer(state,action){
  switch(action.type){
    case 'ADD_PROF':return{...state,profs:[...state.profs,action.payload]};
    case 'UPD_PROF':return{...state,profs:state.profs.map(p=>p._id===action.payload._id?action.payload:p)};
    case 'DEL_PROF':return{...state,profs:state.profs.filter(p=>p._id!==action.payload)};
    case 'ADD_CLASSE':return{...state,classes:[...state.classes,action.payload]};
    case 'UPD_CLASSE':return{...state,classes:state.classes.map(c=>c._id===action.payload._id?action.payload:c)};
    case 'DEL_CLASSE':return{...state,classes:state.classes.filter(c=>c._id!==action.payload)};
    case 'ADD_COURS':return{...state,courses:[...state.courses,action.payload]};
    case 'UPD_COURS':return{...state,courses:state.courses.map(c=>c._id===action.payload._id?action.payload:c)};
    case 'DEL_COURS':return{...state,courses:state.courses.filter(c=>c._id!==action.payload)};
    case 'ADD_CAT':return{...state,categories:[...state.categories,action.payload]};
    case 'UPD_CAT':return{...state,categories:state.categories.map(c=>c._id===action.payload._id?action.payload:c)};
    case 'DEL_CAT':return{...state,categories:state.categories.filter(c=>c._id!==action.payload)};
    case 'ADD_ATTR':return{...state,attributions:[...state.attributions,action.payload]};
    case 'UPD_ATTR':return{...state,attributions:state.attributions.map(a=>a._id===action.payload._id?action.payload:a)};
    case 'DEL_ATTR':return{...state,attributions:state.attributions.filter(a=>a._id!==action.payload)};
    case 'SET_STATE':return action.payload;
    case 'UPD_DEPECHE':return{...state,depeche:action.payload};
    case 'SYNC_CATS':return{...state,categories:action.payload};
    case 'UPD_RLMO_REF':return{...state,depeche:{...state.depeche,rlmoRows:action.payload.rows,rlmoAnnee:action.payload.annee}};
    case 'ADD_CIRC':return{...state,circulaires:[...(state.circulaires||[]),action.payload]};
    case 'UPD_CIRC':return{...state,circulaires:(state.circulaires||[]).map(c=>c._id===action.payload._id?action.payload:c)};
    case 'DEL_CIRC':return{...state,circulaires:(state.circulaires||[]).filter(c=>c._id!==action.payload)};
    case 'IMPORT_REPLACE':return{...state,profs:action.payload.profs,classes:action.payload.classes,attributions:action.payload.attributions,courses:action.payload.courses,categories:action.payload.categories};
    case 'IMPORT_MERGE':{
      const merge=(ex,inc,key)=>{const m={};ex.forEach(r=>{m[r[key]]=r;});inc.forEach(r=>{m[r[key]]={...m[r[key]],...r,_id:(m[r[key]]||{})._id||r._id};});return Object.values(m);};
      return{profs:merge(state.profs,action.payload.profs,'Pseudo'),classes:merge(state.classes,action.payload.classes,'CODEClasse'),courses:merge(state.courses,action.payload.courses,'Libellé long'),categories:merge(state.categories,action.payload.categories,'Catégorie'),attributions:action.payload.attributions};
    }
    default:return state;
  }
}

function App(){
  const[session,setSession_]=useState(()=>getSession());
  const[annee,setAnnee]=useState(()=>getCurrentAnnee());
  const[view,setView]=useState('dashboard');
  const[state,dispatch_]=useReducer(reducer,null,()=>{
    const key=storageKeyForAnnee(getCurrentAnnee());
    STORAGE_KEY=key;
    return initState();
  });

  function dispatch(action){dispatch_(action);}
  function handleLogin(user){setSession_(user);}
  function handleLogout(){clearSession();setSession_(null);setView('dashboard');}

  // Persistance: sauvegarde à chaque changement d'état
  useEffect(()=>{
    const key=storageKeyForAnnee(annee);
    saveState(state,key);
  },[state,annee]);

  // Changement d'année scolaire
  function handleChangeAnnee(newAnnee,newState){
    const newKey=storageKeyForAnnee(newAnnee);
    STORAGE_KEY=newKey;
    ANNEE=newAnnee;
    setAnnee(newAnnee);
    if(newState){
      // Nouvel état fourni (copie d'une autre année)
      dispatch({type:'SET_STATE',payload:newState});
    }else{
      // Charger les données existantes pour cette année
      const saved=loadState(newKey);
      if(saved){dispatch({type:'SET_STATE',payload:saved});}
      else{dispatch({type:'SET_STATE',payload:{profs:INIT_PROFS.map(p=>({...p,_id:uid()})),classes:INIT_CLASSES.map(c=>({...c,_id:uid()})),attributions:[],courses:INIT_COURSES.map(c=>({...c,_id:uid()})),categories:INIT_CATS.map(c=>({...c,_id:uid()}))}});}
    }
    setView('dashboard');
  }

  // Restauration depuis sauvegarde
  function handleRestored(data,restoredAnnee){
    const targetAnnee=restoredAnnee||annee;
    if(targetAnnee!==annee){
      ANNEE=targetAnnee;
      STORAGE_KEY=storageKeyForAnnee(targetAnnee);
      setAnnee(targetAnnee);
    }
    dispatch({type:'SET_STATE',payload:data});
    setView('dashboard');
  }

  if(!session)return <LoginView onLogin={handleLogin}/>;
  const niveau=session.niveau||(session.role==='admin'?1:4);
  const isAdmin=niveau===1;
  const canEditAttr=niveau<=3;
  const classesAutorisees=niveau===3?(session.classesAutorisees||[]):null;

  // Navigation dynamique selon niveau
  const navSections=(()=>{
    const nav=[{label:'Navigation',items:[{id:'dashboard',label:'Tableau de bord',icon:I.home}]}];
    if(niveau===1)nav.push({label:'Données de base',items:[{id:'profs',label:'Enseignants',icon:I.users},{id:'classes',label:'Classes',icon:I.layers},{id:'cours',label:'Cours',icon:I.book},{id:'categories',label:'Catégories NTTP',icon:I.grid}]});
    nav.push({label:'Attributions',items:[{id:'attr-classe',label:'Par classe',icon:I.grid},{id:'attr-prof',label:'Par enseignant',icon:I.swap}]});
    const acts=[];
    if(niveau<=2)acts.push({id:'impressions',label:'Impressions & Doc 12',icon:I.printer});
    if(niveau===1){acts.push({id:'email',label:'Envoi email',icon:I.mail});acts.push({id:'import',label:'Importer Excel',icon:I.upload});acts.push({id:'export',label:'Exporter Excel',icon:I.download});acts.push({id:'backups',label:'Sauvegardes',icon:I.check});}
    if(acts.length>0)nav.push({label:'Actions',items:acts});
    nav.push({label:'Outils',items:[{id:'depeches',label:'Dépêches FWB',icon:I.download},{id:'rlmo',label:'Simulateur RLMO',icon:I.chart},{id:'reglements',label:'Réglementations',icon:I.shield}]});
    if(niveau===1)nav.push({label:'Admin',items:[{id:'utilisateurs',label:'Utilisateurs',icon:I.settings}]});
    return nav;
  })();

  const views={
    'dashboard':<Dashboard state={state} setView={setView}/>,
    'profs':<ProfsView state={state} dispatch={dispatch} isAdmin={isAdmin}/>,
    'classes':<ClassesView state={state} dispatch={dispatch} isAdmin={isAdmin}/>,
    'cours':<CoursView state={state} dispatch={dispatch} isAdmin={isAdmin}/>,
    'categories':<CategoriesView state={state} dispatch={dispatch} isAdmin={isAdmin}/>,
    'attr-classe':<AttrClasseView state={state} dispatch={dispatch} isAdmin={canEditAttr} classesFilter={classesAutorisees}/>,
    'attr-prof':<AttrProfView state={state}/>,
    'impressions':<ImpressionsView state={state}/>,
    'email':<EmailView state={state}/>,
    'import':<ImportView dispatch={dispatch} setView={setView} state={state} annee={annee}/>,
    'export':<ExportView state={state}/>,
    'backups':<BackupsView state={state} anneeActive={annee} onRestored={handleRestored}/>,
    'depeches':<DepechesView state={state} dispatch={dispatch} isAdmin={isAdmin}/>,
    'rlmo':<RLMOSimulateurView state={state} dispatch={dispatch}/>,
    'reglements':<ReglementsView state={state} dispatch={dispatch} isAdmin={isAdmin}/>,
    'utilisateurs':<UtilisateursView currentUser={session} state={state}/>,
  };

  // Guard : vues autorisées par niveau
  const allowedViews=navSections.flatMap(s=>s.items.map(i=>i.id));
  const activeView=allowedViews.includes(view)?view:'dashboard';

  return <>
    <nav id="sidebar" className="no-print">
      <div className="sidebar-logo">
        <img src="Données/logo_gestioLys.png" alt="GestioLys" onError={e=>e.target.style.display='none'}/>
        <h1>GestioLys</h1>
        <p>{ECOLE}</p>
      </div>

      {/* Sélecteur d'année scolaire */}
      <AnneeSelector annee={annee} onChangeAnnee={handleChangeAnnee} state={state}/>

      <div className="sidebar-user">
        <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160}}>👤 {session.nom}</span>
        <span style={{fontSize:9,background:niveau===1?'#dc2626':niveau===2?'#2563eb':niveau===3?'#d97706':'#475569',color:'#fff',padding:'1px 5px',borderRadius:3,flexShrink:0}}>N{niveau}</span>
      </div>

      {navSections.map(sec=><div key={sec.label}>
        <div className="nav-section">{sec.label}</div>
        {sec.items.map(item=><div key={item.id} className={`nav-item${activeView===item.id?' active':''}`} onClick={()=>setView(item.id)}>
          <Icon d={item.icon} size={14}/>{item.label}
          {item.id==='backups'&&<span style={{marginLeft:'auto',fontSize:9,background:'#334155',color:'#94a3b8',padding:'1px 4px',borderRadius:3}}>{loadBackups().length}</span>}
        </div>)}
      </div>)}

      <div style={{marginTop:'auto',padding:'10px 5px',borderTop:'1px solid #334155'}}>
        {isAdmin&&<div className="nav-item" style={{color:'#f87171',fontSize:11.5}} onClick={()=>{if(window.confirm('⚠ Réinitialiser TOUTES les données de l\'année '+annee+' ?')){localStorage.removeItem(storageKeyForAnnee(annee));window.location.reload();}}}>
          <Icon d={I.trash} size={13}/>Réinitialiser {annee}
        </div>}
        <div className="nav-item" style={{color:'#f87171'}} onClick={handleLogout}>
          <Icon d={I.logout} size={13}/>Déconnexion
        </div>
      </div>
    </nav>

    <main id="main">
      {views[activeView]||<div className="page"><p>Vue non trouvée.</p></div>}
    </main>

    {/* Assistant IA flottant */}
    <FloatingAssistant state={state} annee={annee}/>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

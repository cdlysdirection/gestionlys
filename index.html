      <div className="grid-2"><div className="form-group"><label>Année</label><input value={modal.data.Année} onChange={e=>upd('Année',e.target.value)} placeholder="ex: 1D1"/></div><div className="form-group"><label>GP</label><input value={modal.data.GP} onChange={e=>upd('GP',e.target.value)}/></div></div>
      <div className="form-group"><label>Code Classe *</label><input value={modal.data.CODEClasse} onChange={e=>upd('CODEClasse',e.target.value)} placeholder="ex: 1C.1"/></div>

      <div className="grid-3"><div className="form-group"><label>Nombre d'élèves</label><input type="number" value={modal.data['Nbre Elev']} onChange={e=>upd('Nbre Elev',e.target.value)}/></div><div className="form-group"><label>♀ Filles</label><input type="number" min="0" value={modal.data.Filles} onChange={e=>upd('Filles',e.target.value)} placeholder="0"/></div><div className="form-group"><label>♂ Garçons</label><input type="number" min="0" value={modal.data.Garçons} onChange={e=>upd('Garçons',e.target.value)} placeholder="0"/></div></div>
      <div className="grid-2"><div className="form-group"><label>LM1 — Langue Moderne 1</label><select value={modal.data.LM1} onChange={e=>upd('LM1',e.target.value)}><option value="">— Non renseigné —</option><option value="Néerlandais">Néerlandais</option><option value="Anglais">Anglais</option></select></div><div className="form-group"><label>LM2 — Langue Moderne 2</label><select value={modal.data.LM2} onChange={e=>upd('LM2',e.target.value)}><option value="">— Non renseigné —</option><option value="Néerlandais">Néerlandais</option><option value="Anglais">Anglais</option></select></div></div>
    </Modal>}
    {confirm&&<Confirm message={confirm.message} onConfirm={confirm.onConfirm} onCancel={()=>setConfirm(null)}/>}
  </div>;
}

function CoursView({state,dispatch,isAdmin}){

    <div className="table-container"><table><thead><tr><th>Code</th><th>Abr.</th><th>Libellé long</th><th>Fonction</th>{isAdmin&&<th style={{width:70}}>Act.</th>}</tr></thead><tbody>

    </tbody></table></div></div>
    {modal&&<Modal title={modal.mode==='add'?'Ajouter un cours':'Modifier le cours'} onClose={()=>setModal(null)} footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>Annuler</button><button className="btn btn-primary" onClick={handleSave}>Enregistrer</button></>}>
      <div className="form-group"><label>Libellé long *</label><input value={modal.data['Libellé long']} onChange={e=>upd('Libellé long',e.target.value.toUpperCase())}/></div>
      <div className="grid-3"><div className="form-group"><label>Abréviation</label><input value={modal.data.Abr5} onChange={e=>upd('Abr5',e.target.value.toUpperCase().slice(0,5))} maxLength={5}/></div><div className="form-group"><label>Code cours</label><input value={modal.data['Code cours']} onChange={e=>upd('Code cours',e.target.value)}/></div><div className="form-group"><label>Fonction</label><select value={modal.data.Fonction} onChange={e=>upd('Fonction',e.target.value)}><option value="CG">CG – Général</option><option value="CT">CT – Technique</option><option value="PP">PP – Pratique</option><option value="REL">REL – Religion</option></select></div></div>
    </Modal>}
    {confirm&&<Confirm message={confirm.message} onConfirm={confirm.onConfirm} onCancel={()=>setConfirm(null)}/>}
  </div>;
}

function CategoriesView({state,dispatch,isAdmin}){
  const[modal,setModal]=useState(null);const[confirm,setConfirm]=useState(null);
  const[suppModal,setSuppModal]=useState(null);
  const dep=state.depeche||INIT_DEPECHE;
  const supplements=(dep.ntpp&&dep.ntpp.supplements)||[];
  const retraits=(dep.ntpp&&dep.ntpp.retraits)||[];
  const usedByCat=useMemo(()=>{const m={};state.attributions.forEach(a=>{const k=a['Catégorie heure']||'';m[k]=(m[k]||0)+sfloat(a["Nbre d'heure attribué"]);});return m;},[state.attributions]);
  function getUsed(cat){const cn=catNum(cat.Catégorie);if(!cn)return 0;const key=Object.keys(usedByCat).find(k=>catNum(k)===cn)||'';return Math.round((usedByCat[key]||0)*10)/10;}
  // Totaux catégories
  const totalNTTP=state.categories.reduce((s,c)=>s+sint(c.NTTP),0);
  const totalPrelev=state.categories.reduce((s,c)=>s+sint(c['Prélèvement zonale']),0);
  const totalDispo=state.categories.reduce((s,c)=>s+sint(c.Total),0);
  const totalUtilise=Math.round(state.categories.reduce((s,c)=>s+getUsed(c),0)*10)/10;
  const totalSupp=supplements.reduce((s,x)=>s+sint(x.valeur),0);
  const totalRetr=retraits.reduce((s,x)=>s+sint(x.valeur),0);
  const totalOrganisable=totalDispo+totalSupp-totalRetr;
  // Catégories CRUD
  function openAdd(){setModal({mode:'add',data:{Catégorie:'',NTTP:0,'Prélèvement zonale':0,Total:0}});}
  function openEdit(c){setModal({mode:'edit',data:{...c}});}
  function handleSave(){if(!modal.data.Catégorie)return alert('Catégorie requise');const data={...modal.data,Total:sint(modal.data.NTTP)-sint(modal.data['Prélèvement zonale'])};if(modal.mode==='add')dispatch({type:'ADD_CAT',payload:{...data,_id:uid()}});else dispatch({type:'UPD_CAT',payload:data});setModal(null);}
  function handleDel(c){setConfirm({message:'Supprimer cette catégorie ?',onConfirm:()=>{dispatch({type:'DEL_CAT',payload:c._id});setConfirm(null);}});}
  const upd=(k,v)=>setModal(m=>({...m,data:{...m.data,[k]:v}}));
  // Suppléments/Retraits CRUD
  function openAddSupp(type){setSuppModal({type,isNew:true,data:{code:'',label:'',valeur:0}});}
  function openEditSupp(item,type){setSuppModal({type,isNew:false,data:{...item}});}
  function handleSaveSupp(){
    if(!suppModal.data.label)return alert('Libellé requis');
    const key=suppModal.type==='supp'?'supplements':'retraits';
    let list=[...(dep.ntpp[key]||[])];
    const item={...suppModal.data,valeur:sint(suppModal.data.valeur)};
    if(suppModal.isNew){list=[...list,{...item,_id:uid()}];}
    else{list=list.map(x=>(x._id&&x._id===item._id)||(x.code&&x.code===item.code&&x.label===item.label)?item:x);}
    dispatch({type:'UPD_DEPECHE',payload:{...dep,ntpp:{...dep.ntpp,[key]:list}}});
    setSuppModal(null);
  }
  function delSupp(item,type){
    const key=type==='supp'?'supplements':'retraits';
    const list=(dep.ntpp[key]||[]).filter(x=>x._id?x._id!==(item._id):x.code!==item.code||x.label!==item.label);
    dispatch({type:'UPD_DEPECHE',payload:{...dep,ntpp:{...dep.ntpp,[key]:list}}});
  }
  const updS=(k,v)=>setSuppModal(m=>({...m,data:{...m.data,[k]:v}}));
  const BH={padding:'7px 10px',background:'#1e293b',color:'#fff',fontWeight:600,fontSize:11,border:'1px solid #334155'};
  const BHC={...BH,textAlign:'center'};
  const BC={padding:'6px 9px',border:'1px solid var(--gray-100)',fontSize:12.5};
  const BCC={...BC,textAlign:'center'};
  // Tableau suppléments helper
  function SuppTable({list,type,label,icon,color}){
    return <div className="card" style={{marginBottom:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div style={{fontSize:13,fontWeight:700,color}}>{icon} {label}</div>
        {isAdmin&&<button className="btn btn-primary btn-sm" onClick={()=>openAddSupp(type)}><Icon d={I.plus}/>Ajouter</button>}
      </div>
      {list.length===0?<p style={{fontSize:12,color:'var(--gray-400)',fontStyle:'italic'}}>Aucun élément — cliquez « Ajouter » pour en créer un.</p>:
      <table style={{width:'100%',borderCollapse:'collapse'}}>
        <thead><tr><th style={BH}>Code</th><th style={BH}>Libellé</th><th style={BHC}>Périodes</th>{isAdmin&&<th style={{...BHC,width:70}}>Act.</th>}</tr></thead>
        <tbody>{list.map((x,i)=><tr key={x._id||x.code||i} style={{background:i%2===0?'#fff':'#f8fafc'}}>
          <td style={{...BC,fontFamily:'monospace',fontWeight:700,fontSize:11,color}}>{x.code||'—'}</td>
          <td style={BC}>{x.label}</td>
          <td style={{...BCC,fontWeight:700,color,fontSize:13}}>{type==='supp'?'+':'-'}{x.valeur}</td>
          {isAdmin&&<td style={BCC}><div style={{display:'flex',gap:3,justifyContent:'center'}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>openEditSupp(x,type)}><Icon d={I.edit} size={12}/></button>
            <button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>delSupp(x,type)}><Icon d={I.trash} size={12}/></button>
          </div></td>}
        </tr>)}
        <tr style={{background:'#f1f5f9',fontWeight:700,borderTop:'2px solid #1e293b'}}>
          <td colSpan={2} style={{...BC,fontSize:12}}>TOTAL {label.toUpperCase()}</td>
          <td style={{...BCC,fontSize:14,color}}>{type==='supp'?'+':'-'}{type==='supp'?totalSupp:totalRetr}</td>
          {isAdmin&&<td/>}
        </tr></tbody>
      </table>}
    </div>;
  }
  return <div className="page">
    <div className="page-header"><div><div className="page-title">Catégories NTTP</div><div className="page-subtitle">Périodes organisables, suppléments et retraits</div></div>{isAdmin&&<button className="btn btn-primary" onClick={openAdd}><Icon d={I.plus}/>Catégorie</button>}</div>
    {/* Récapitulatif général */}
    <div className="card" style={{marginBottom:14,borderLeft:'4px solid #1e293b'}}>
      <div style={{fontSize:13,fontWeight:700,color:'#1e293b',marginBottom:12}}>Récapitulatif NTTP — {dep.ntpp&&dep.ntpp.annee||ANNEE}</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10}}>
        {[
          {label:'NTTP brut catégories',val:totalNTTP,color:'var(--gray-700)',sign:''},
          {label:'Prélèvements zonaux',val:'-'+totalPrelev,color:'var(--red)',sign:''},
          {label:'NTTP net catégories',val:totalDispo,color:'#1e293b',sign:'',bold:true},
          {label:'Total suppléments',val:'+'+totalSupp,color:'var(--green)',sign:''},
          {label:'Total retraits',val:'-'+totalRetr,color:'var(--red)',sign:''},
          {label:'TOTAL ORGANISABLE',val:totalOrganisable,color:'var(--blue)',sign:'',bold:true,large:true},
        ].map(item=><div key={item.label} style={{padding:'10px 14px',borderRadius:8,border:`1px solid ${item.bold?'#1e293b':'var(--gray-200)'}`,background:item.bold?'#f0f9ff':'#fff'}}>
          <div style={{fontSize:10.5,color:'var(--gray-500)',marginBottom:3}}>{item.label}</div>
          <div style={{fontSize:item.large?22:18,fontWeight:800,color:item.color}}>{item.val}</div>
          <div style={{fontSize:9.5,color:'var(--gray-400)'}}>périodes</div>
        </div>)}
      </div>
      {totalUtilise>0&&<div style={{marginTop:10,fontSize:12,color:'var(--gray-600)'}}>Heures encodées dans les attributions : <strong>{totalUtilise}h</strong> sur <strong>{totalDispo}h</strong> disponibles ({totalDispo>0?Math.round((totalUtilise/totalDispo)*100):0}%)</div>}
    </div>
    {/* Tableau catégories */}
    <div style={{background:'#fff',borderRadius:10,border:'1px solid var(--gray-200)',marginBottom:14}}><div className="table-container"><table><thead><tr><th>Catégorie</th><th style={{textAlign:'center'}}>NTTP</th><th style={{textAlign:'center'}}>Prélèv. zonal</th><th style={{textAlign:'center'}}>Dispo</th><th style={{textAlign:'center'}}>Utilisé</th><th style={{textAlign:'center'}}>Reste</th><th>Progression</th>{isAdmin&&<th style={{width:70}}>Act.</th>}</tr></thead><tbody>
    {state.categories.map(c=>{const used=getUsed(c);const total=sint(c.Total);const reste=Math.round((total-used)*10)/10;const pct=total>0?Math.round((used/total)*100):0;const color=pct>100?'var(--red)':pct>90?'var(--amber)':'var(--green)';return <tr key={c._id}><td style={{fontSize:11.5,maxWidth:270}}>{c.Catégorie}</td><td style={{textAlign:'center',fontWeight:600}}>{c.NTTP}</td><td style={{textAlign:'center',color:'var(--red)',fontWeight:600}}>{c['Prélèvement zonale']?'-'+c['Prélèvement zonale']:'—'}</td><td style={{textAlign:'center',fontWeight:700}}>{c.Total}</td><td style={{textAlign:'center',color,fontWeight:700}}>{used||'—'}</td><td style={{textAlign:'center',fontWeight:700,color:reste<0?'var(--red)':used>0?'var(--green)':'var(--gray-400)'}}>{used>0?reste:'—'}</td><td>{used>0?<div style={{display:'flex',alignItems:'center',gap:5}}><div style={{flex:1,height:6,background:'var(--gray-200)',borderRadius:9999,minWidth:50}}><div style={{height:'100%',width:`${Math.min(pct,100)}%`,background:color,borderRadius:9999}}/></div><span style={{fontSize:10.5,color,fontWeight:700,minWidth:32}}>{pct}%</span></div>:<span style={{fontSize:11,color:'var(--gray-300)'}}>—</span>}</td>{isAdmin&&<td><div style={{display:'flex',gap:3}}><button className="btn btn-ghost btn-sm" onClick={()=>openEdit(c)}><Icon d={I.edit} size={13}/></button><button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>handleDel(c)}><Icon d={I.trash} size={13}/></button></div></td>}</tr>;})}
    <tr style={{background:'#f1f5f9',fontWeight:700,borderTop:'2px solid #1e293b'}}>
      <td style={{padding:'7px 11px',fontSize:12}}>TOTAL</td>
      <td style={{padding:'7px 11px',textAlign:'center',fontWeight:800}}>{totalNTTP}</td>
      <td style={{padding:'7px 11px',textAlign:'center',color:'var(--red)',fontWeight:700}}>-{totalPrelev}</td>
      <td style={{padding:'7px 11px',textAlign:'center',fontWeight:800,color:'var(--blue)'}}>{totalDispo}</td>
      <td style={{padding:'7px 11px',textAlign:'center',fontWeight:700}}>{totalUtilise||'—'}</td>
      <td colSpan={isAdmin?3:2} style={{padding:'7px 11px',textAlign:'center',fontWeight:700,color:'var(--green)'}}>{totalUtilise>0?Math.round((totalDispo-totalUtilise)*10)/10:'—'}</td>
    </tr>
    </tbody></table></div></div>
    {/* Suppléments */}
    <SuppTable list={supplements} type="supp" label="Suppléments de périodes" icon="📈" color="var(--green)"/>
    {/* Retraits */}
    <SuppTable list={retraits} type="retrait" label="Retraits de périodes" icon="📉" color="var(--red)"/>
    {/* Modal catégorie */}
    {modal&&<Modal title={modal.mode==='add'?'Ajouter une catégorie':'Modifier la catégorie'} onClose={()=>setModal(null)} footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>Annuler</button><button className="btn btn-primary" onClick={handleSave}>Enregistrer</button></>}>
      <div className="form-group"><label>Libellé catégorie *</label><input value={modal.data.Catégorie} onChange={e=>upd('Catégorie',e.target.value)}/></div>
      <div className="grid-2"><div className="form-group"><label>NTTP brut</label><input type="number" value={modal.data.NTTP} onChange={e=>upd('NTTP',e.target.value)}/></div><div className="form-group"><label>Prélèvement zonal</label><input type="number" value={modal.data['Prélèvement zonale']} onChange={e=>upd('Prélèvement zonale',e.target.value)}/></div></div>
      <div className="form-group"><label>Total disponible (calculé automatiquement)</label><input readOnly value={sint(modal.data.NTTP)-sint(modal.data['Prélèvement zonale'])} style={{background:'var(--gray-50)',fontWeight:700}}/></div>
    </Modal>}
    {/* Modal supplément/retrait */}
    {suppModal&&(()=>{
      const officielList=suppModal.type==='supp'?SUPP_OFFICIELS:RETRAIT_OFFICIELS;
      const isCustom=!officielList.find(o=>o.code===suppModal.data.code&&o.code!=='');
      function pickOfficiel(e){
        const code=e.target.value;
        if(code==='__custom__'){return;}
        const found=officielList.find(o=>o.code===code);
        if(found&&found.code!==''){updS('code',found.code);setSuppModal(m=>({...m,data:{...m.data,code:found.code,label:found.label}}));}
        else{setSuppModal(m=>({...m,data:{...m.data,code:'',label:''}}));}
      }
      const selVal=officielList.find(o=>o.code===suppModal.data.code&&o.code!=='')?suppModal.data.code:(suppModal.data.code===''&&suppModal.data.label===''?'':'__custom__');
      return <Modal title={`${suppModal.isNew?'Ajouter':'Modifier'} — ${suppModal.type==='supp'?'Supplément':'Retrait'}`} onClose={()=>setSuppModal(null)} footer={<><button className="btn btn-secondary" onClick={()=>setSuppModal(null)}>Annuler</button><button className="btn btn-primary" onClick={handleSaveSupp}>Enregistrer</button></>}>
        {suppModal.isNew&&<div className="form-group">
          <label style={{fontWeight:700}}>Code officiel FWB</label>
          <select value={selVal} onChange={pickOfficiel} style={{width:'100%',padding:'8px 10px',border:'1px solid var(--gray-300)',borderRadius:6,fontSize:13,background:'#fff'}}>
            <option value="">— Sélectionner un code officiel —</option>
            {officielList.filter(o=>o.code!=='').map(o=><option key={o.code} value={o.code}>[{o.code}] {o.label}</option>)}
            <option value="__custom__">✏️ Autre / code personnalisé…</option>
          </select>
          {selVal&&selVal!==''&&selVal!=='__custom__'&&<div style={{marginTop:5,padding:'5px 9px',background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:5,fontSize:11.5,color:'#166534'}}>✓ Code officiel sélectionné — vous pouvez ajuster le libellé et les périodes ci-dessous.</div>}
        </div>}
        <div className="grid-2">
          <div className="form-group"><label>Code {suppModal.isNew&&selVal===''?'':'officiel'}</label><input value={suppModal.data.code} onChange={e=>updS('code',e.target.value)} placeholder="ex: 02, 04, prz…" style={{fontFamily:'monospace',fontWeight:700}}/></div>
          <div className="form-group"><label>Périodes</label><input type="number" min="0" value={suppModal.data.valeur} onChange={e=>updS('valeur',e.target.value)}/></div>
        </div>
        <div className="form-group"><label>Libellé *</label><input value={suppModal.data.label} onChange={e=>updS('label',e.target.value)} placeholder="ex: Pc D1 — Périodes complémentaires 1er degré"/></div>
        <div className="alert" style={{background:suppModal.type==='supp'?'var(--green-light)':'var(--red-light)',color:suppModal.type==='supp'?'var(--green)':'var(--red)',border:`1px solid ${suppModal.type==='supp'?'#bbf7d0':'#fca5a5'}`,fontSize:11.5}}>{suppModal.type==='supp'?'📈 Supplément : s\'ajoute au NTTP net des catégories':'📉 Retrait : se soustrait du NTTP net des catégories'}</div>
      </Modal>;
    })()}
    {confirm&&<Confirm message={confirm.message} onConfirm={confirm.onConfirm} onCancel={()=>setConfirm(null)}/>}
  </div>;
}
// ── ATTRIBUTIONS PAR CLASSE ───────────────────────────────────────────────────
function AttrClasseView({state,dispatch,isAdmin,classesFilter}){
  const[sel,setSel]=useState('');const[modal,setModal]=useState(null);const[confirm,setConfirm]=useState(null);
  const classes=useMemo(()=>{const all=state.classes.map(c=>c.CODEClasse).sort();return classesFilter?all.filter(c=>classesFilter.includes(c)):all;},[state.classes,classesFilter]);
  const attrs=useMemo(()=>sel?state.attributions.filter(a=>a.Classe===sel):[],[state.attributions,sel]);
  const totalHrs=attrs.reduce((s,a)=>s+sfloat(a.Hrs),0);
  const totalAtt=attrs.reduce((s,a)=>s+sfloat(a["Nbre d'heure attribué"]),0);
  const totalRgpt=attrs.reduce((s,a)=>s+sfloat(a.HRGPT),0);
  function openAdd(){setModal({mode:'add',data:{Classe:sel,'Libellé long':'',Hrs:2,Fonction:'CG','Code cours':'',Abr5:'','Prof Principal':'','Pseudo ProfP':'',"Nbre d'heure attribué":2,HRGPT:0,CLASRGPT:'','Catégorie heure':'','PROF REMP':'','Pseudo ProfR':''}});}
  function openEdit(a){setModal({mode:'edit',data:{...a}});}
  function handleSave(){if(modal.mode==='add')dispatch({type:'ADD_ATTR',payload:{...modal.data,_id:uid()}});else dispatch({type:'UPD_ATTR',payload:modal.data});setModal(null);}
  function handleDel(a){setConfirm({message:`Supprimer l'attribution de ${a['Libellé long']} ?`,onConfirm:()=>{dispatch({type:'DEL_ATTR',payload:a._id});setConfirm(null);}});}
  const upd=(k,v)=>setModal(m=>({...m,data:{...m.data,[k]:v}}));
  function setProfP(pseudo){const prof=state.profs.find(p=>p.Pseudo===pseudo);setModal(m=>({...m,data:{...m.data,'Pseudo ProfP':pseudo,'Prof Principal':prof?prof.Nom:''}}));}
  function setProfR(pseudo){const prof=state.profs.find(p=>p.Pseudo===pseudo);setModal(m=>({...m,data:{...m.data,'Pseudo ProfR':pseudo,'PROF REMP':prof?prof.Nom:''}}));}
  function setCours(lib){const c=state.courses.find(x=>x['Libellé long']===lib);setModal(m=>({...m,data:{...m.data,'Libellé long':lib,Abr5:c?c.Abr5:'',Fonction:c?c.Fonction:'CG','Code cours':c?c['Code cours']:''}}));}
  const fB={CG:'badge-blue',CT:'badge-amber',PP:'badge-green',REL:'badge-purple'};
  return <div className="page">
    <div className="page-header"><div><div className="page-title">Attributions par classe</div><div className="page-subtitle">Saisie et consultation des attributions</div></div>
    <div style={{display:'flex',gap:6}}>{sel&&<button className="btn btn-secondary" onClick={()=>window.print()}><Icon d={I.printer}/>Imprimer</button>}{isAdmin&&sel&&<button className="btn btn-primary" onClick={openAdd}><Icon d={I.plus}/>Ajouter</button>}</div></div>
    <div className="card" style={{marginBottom:14}}><div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <label style={{fontWeight:600,minWidth:70,fontSize:13}}>Classe :</label>
      <select value={sel} onChange={e=>setSel(e.target.value)} style={{maxWidth:220,width:'auto'}}><option value="">— Sélectionner —</option>{classes.map(c=><option key={c} value={c}>{c}</option>)}</select>
      {sel&&<div style={{display:'flex',gap:14,marginLeft:'auto',fontSize:12.5,flexWrap:'wrap'}}>
        <span>Cours : <strong>{attrs.length}</strong></span>
        <span>Réf. : <strong>{Math.round(totalHrs*10)/10}h</strong></span>
        <span style={{color:totalAtt>=totalHrs?'var(--green)':'var(--amber)'}}>Attribuées : <strong>{Math.round(totalAtt*10)/10}h</strong></span>
        {totalRgpt>0&&<span style={{color:'var(--purple)'}}>HRGPT : <strong>{Math.round(totalRgpt*10)/10}h</strong></span>}
      </div>}
    </div></div>
    {sel&&<div style={{background:'#fff',borderRadius:10,border:'1px solid var(--gray-200)'}}><div className="table-container"><table>
      <thead><tr><th>Cours</th><th>Fonc.</th><th style={{textAlign:'center'}}>Hrs réf.</th><th>Enseignant principal</th><th style={{textAlign:'center'}}>Hrs attr.</th><th style={{textAlign:'center'}}>HRGPT</th><th>Prof remp.</th><th>Catégorie</th>{isAdmin&&<th style={{width:65}}>Act.</th>}</tr></thead>
      <tbody>
        {attrs.length===0&&<tr><td colSpan={9} style={{textAlign:'center',color:'var(--gray-400)',padding:28}}>Aucune attribution pour cette classe</td></tr>}
        {attrs.map(a=>{const ok=sfloat(a["Nbre d'heure attribué"])>=sfloat(a.Hrs);return <tr key={a._id}>
          <td style={{fontSize:12,fontWeight:500,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={a['Libellé long']}>{a['Libellé long']}</td>
          <td><span className={`badge ${fB[a.Fonction]||'badge-gray'}`}>{a.Fonction}</span></td>
          <td style={{textAlign:'center'}}>{sfloat(a.Hrs)}</td>
          <td style={{fontSize:11.5}}>{a['Prof Principal']&&<><span className="badge badge-blue" style={{marginRight:3}}>{a['Pseudo ProfP']}</span>{a['Prof Principal']}</>}</td>
          <td style={{textAlign:'center',fontWeight:700,color:ok?'var(--green)':'var(--red)'}}>{sfloat(a["Nbre d'heure attribué"])}</td>
          <td style={{textAlign:'center',color:'var(--purple)',fontWeight:600}}>{sfloat(a.HRGPT)||''}</td>
          <td style={{fontSize:11}}>{a['PROF REMP']}</td>
          <td style={{fontSize:10.5,color:'var(--gray-500)',maxWidth:130,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={a['Catégorie heure']}>{(a['Catégorie heure']||'').replace('Catégorie ','Cat.')}</td>
          {isAdmin&&<td><div style={{display:'flex',gap:2}}><button className="btn btn-ghost btn-sm" onClick={()=>openEdit(a)}><Icon d={I.edit} size={12}/></button><button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>handleDel(a)}><Icon d={I.trash} size={12}/></button></div></td>}
        </tr>;})}
      </tbody>
    </table></div></div>}
    {!sel&&<div className="empty-state"><Icon d={I.grid} size={44}/><p>Sélectionnez une classe pour gérer ses attributions</p></div>}
    {modal&&<Modal title={modal.mode==='add'?'Ajouter une attribution':'Modifier l\'attribution'} onClose={()=>setModal(null)}
      footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>Annuler</button><button className="btn btn-primary" onClick={handleSave}>Enregistrer</button></>}>
      <div className="form-group"><label>Cours *</label>
        <input list="cl-courses" value={modal.data['Libellé long']} onChange={e=>setCours(e.target.value)} placeholder="Rechercher un cours…"/>
        <datalist id="cl-courses">{state.courses.map(c=><option key={c._id} value={c['Libellé long']}/>)}</datalist>
      </div>
      <div className="grid-3">
        <div className="form-group"><label>Fonction</label><select value={modal.data.Fonction} onChange={e=>upd('Fonction',e.target.value)}><option value="CG">CG</option><option value="CT">CT</option><option value="PP">PP</option><option value="REL">REL</option></select></div>
        <div className="form-group"><label>Hrs référentiel</label><input type="number" step="0.5" value={modal.data.Hrs} onChange={e=>upd('Hrs',e.target.value)}/></div>
        <div className="form-group"><label>Hrs attribuées</label><input type="number" step="0.5" value={modal.data["Nbre d'heure attribué"]} onChange={e=>upd("Nbre d'heure attribué",e.target.value)}/></div>
      </div>
      <div className="form-group"><label>Enseignant principal</label>
        <select value={modal.data['Pseudo ProfP']} onChange={e=>setProfP(e.target.value)}>
          <option value="">— Aucun —</option>
          {state.profs.sort((a,b)=>a.Nom.localeCompare(b.Nom)).map(p=><option key={p._id} value={p.Pseudo}>{p.Pseudo} – {p.Nom}</option>)}
        </select>
      </div>
      <div className="grid-2">
        <div className="form-group"><label>Heures groupe (HRGPT)</label><input type="number" step="0.5" value={modal.data.HRGPT||0} onChange={e=>upd('HRGPT',e.target.value)}/></div>
        <div className="form-group"><label>Classe GPT</label><input value={modal.data.CLASRGPT||''} onChange={e=>upd('CLASRGPT',e.target.value)} placeholder="Classe du groupement"/></div>
      </div>
      <div className="form-group"><label>Prof remplaçant</label>
        <select value={modal.data['Pseudo ProfR']||''} onChange={e=>setProfR(e.target.value)}>
          <option value="">— Aucun —</option>
          {state.profs.sort((a,b)=>a.Nom.localeCompare(b.Nom)).map(p=><option key={p._id} value={p.Pseudo}>{p.Pseudo} – {p.Nom}</option>)}
        </select>
      </div>
      <div className="form-group"><label>Catégorie heure</label>
        <select value={modal.data['Catégorie heure']||''} onChange={e=>upd('Catégorie heure',e.target.value)}>
          <option value="">— Sélectionner —</option>
          {state.categories.map(c=><option key={c._id} value={c.Catégorie}>{c.Catégorie}</option>)}
        </select>
      </div>
    </Modal>}
    {confirm&&<Confirm message={confirm.message} onConfirm={confirm.onConfirm} onCancel={()=>setConfirm(null)}/>}
  </div>;
}
// ── ATTRIBUTIONS PAR ENSEIGNANT ───────────────────────────────────────────────
function AttrProfView({state}){
  const[sel,setSel]=useState('');
  const prof=state.profs.find(p=>p.Pseudo===sel);
  const allAttrs=useMemo(()=>sel?state.attributions.filter(a=>a['Pseudo ProfP']===sel||a['Pseudo ProfR']===sel):[],[state.attributions,sel]);
  const mainAttrs=allAttrs.filter(a=>a['Pseudo ProfP']===sel);
  const replAttrs=allAttrs.filter(a=>a['Pseudo ProfR']===sel);
  // HRGPT n'est pas comptabilisé dans le total principal
  const totalMain=mainAttrs.reduce((s,a)=>s+sfloat(a["Nbre d'heure attribué"]),0);
  const totalRgpt=mainAttrs.reduce((s,a)=>s+sfloat(a.HRGPT),0);
  const totalRepl=replAttrs.reduce((s,a)=>s+sfloat(a.HRGPT),0);
  const fB={CG:'badge-blue',CT:'badge-amber',PP:'badge-green',REL:'badge-purple'};
  return <div className="page">
    <div className="page-header"><div><div className="page-title">Attributions par enseignant</div><div className="page-subtitle">Portefeuille d'un enseignant</div></div>
    {sel&&<button className="btn btn-secondary" onClick={()=>window.print()}><Icon d={I.printer}/>Imprimer</button>}</div>
    <div className="card" style={{marginBottom:14}}><div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <label style={{fontWeight:600,minWidth:90,fontSize:13}}>Enseignant :</label>
      <select value={sel} onChange={e=>setSel(e.target.value)} style={{maxWidth:300,width:'auto'}}>
        <option value="">— Sélectionner —</option>
        {state.profs.sort((a,b)=>a.Nom.localeCompare(b.Nom)).map(p=><option key={p._id} value={p.Pseudo}>{p.Pseudo} – {p.Nom}</option>)}
      </select>
    </div>
    {prof&&<div style={{marginTop:10,fontSize:12.5}}>
      <div style={{display:'flex',gap:18,flexWrap:'wrap',marginBottom:4}}>
        <span><strong>Fonction :</strong> {prof['Libellé Fonction']||'—'}</span>
        <span><strong>Volume :</strong> {prof.Vol||'—'}</span>
        <span><strong>Email :</strong> {prof.Email||'—'}</span>
      </div>
      {(prof.nominations||[]).length>1&&<div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:4}}>
        {prof.nominations.slice(1).map((n,i)=><span key={i} style={{background:'var(--blue-light)',border:'1px solid #bfdbfe',borderRadius:6,padding:'2px 8px',fontSize:11.5,color:'var(--blue-dark)'}}>{n['Libellé Fonction']}{n.Vol?' ('+n.Vol+')':''}</span>)}
      </div>}
      <span style={{color:'var(--green)'}}><strong>Total principal :</strong> {Math.round(totalMain*10)/10}h</span>
      {totalRgpt>0&&<span style={{color:'var(--purple)'}}><strong>HRGPT :</strong> {Math.round(totalRgpt*10)/10}h (non comptabilisé)</span>}
      {totalRepl>0&&<span style={{color:'var(--amber)'}}><strong>Total remp. :</strong> {Math.round(totalRepl*10)/10}h</span>}
    </div>}</div>
    {sel&&<>
      {mainAttrs.length>0&&<div style={{marginBottom:16}}>
        <h3 style={{fontSize:13,fontWeight:700,marginBottom:8,color:'var(--gray-700)'}}>Cours principaux ({mainAttrs.length})</h3>
        <div style={{background:'#fff',borderRadius:10,border:'1px solid var(--gray-200)'}}><div className="table-container"><table>
          <thead><tr><th>Classe</th><th>Cours</th><th>Fonc.</th><th style={{textAlign:'center'}}>Hrs attr.</th><th style={{textAlign:'center'}}>HRGPT</th><th>Catégorie</th></tr></thead>
          <tbody>{mainAttrs.map(a=><tr key={a._id}><td style={{fontWeight:600}}>{a.Classe}</td><td style={{fontSize:12}}>{a['Libellé long']}</td><td><span className={`badge ${fB[a.Fonction]||'badge-gray'}`}>{a.Fonction}</span></td><td style={{textAlign:'center',fontWeight:700,color:'var(--green)'}}>{sfloat(a["Nbre d'heure attribué"])}</td><td style={{textAlign:'center',color:'var(--purple)'}}>{sfloat(a.HRGPT)||'—'}</td><td style={{fontSize:10.5,color:'var(--gray-500)'}}>{(a['Catégorie heure']||'').replace('Catégorie ','Cat.')}</td></tr>)}</tbody>
          <tfoot><tr style={{background:'var(--gray-50)',fontWeight:700}}><td colSpan={3} style={{padding:'7px 11px',fontSize:12}}>TOTAL (HRGPT exclu)</td><td style={{textAlign:'center',padding:'7px 11px',color:'var(--green)',fontSize:14}}>{Math.round(totalMain*10)/10}</td><td style={{textAlign:'center',padding:'7px 11px',color:'var(--purple)',fontSize:12}}>{Math.round(totalRgpt*10)/10}</td><td/></tr></tfoot>
        </table></div></div>
      </div>}
      {replAttrs.length>0&&<div>
        <h3 style={{fontSize:13,fontWeight:700,marginBottom:8,color:'var(--amber)'}}>Cours en remplacement ({replAttrs.length})</h3>
        <div style={{background:'#fff',borderRadius:10,border:'1px solid var(--gray-200)'}}><div className="table-container"><table>
          <thead><tr><th>Classe</th><th>Cours</th><th>Fonc.</th><th style={{textAlign:'center'}}>Hrs GPT</th><th>Classe GPT</th></tr></thead>
          <tbody>{replAttrs.map(a=><tr key={a._id}><td style={{fontWeight:600}}>{a.Classe}</td><td style={{fontSize:12}}>{a['Libellé long']}</td><td><span className={`badge ${fB[a.Fonction]||'badge-gray'}`}>{a.Fonction}</span></td><td style={{textAlign:'center',color:'var(--amber)',fontWeight:700}}>{sfloat(a.HRGPT)}</td><td>{a.CLASRGPT}</td></tr>)}</tbody>
        </table></div></div>
      </div>}
      {allAttrs.length===0&&<div className="empty-state"><p>Aucune attribution pour cet enseignant</p></div>}
    </>}
    {!sel&&<div className="empty-state"><Icon d={I.users} size={44}/><p>Sélectionnez un enseignant pour voir ses attributions</p></div>}
  </div>;
}
// ── FICHES IMPRESSION ─────────────────────────────────────────────────────────

      </div>
    </div>
    <div style={{height:2,background:'#1e293b',margin:'8px 0 14px'}}/>

    <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>

        <th style={{...B,width:80}}>Classe</th><th style={B}>Nom du cours</th>
        <th style={{...BC,width:75}}>Nb heures</th><th style={{...BC,width:95}}>Nb h. RGPT<br/><span style={{fontWeight:400,fontSize:9}}>(non comptab.)</span></th>
      </tr></thead>
      <tbody>{attrs.map((a,i)=>{
        const hrs=sfloat(isRemp?(a.HRGPT||0):(a["Nbre d'heure attribué"]||0));

        return <tr key={i} style={{background:i%2===0?'#fff':'#f8fafc'}}>

        <td style={{...BC,fontSize:13,background:'#1e293b',color:'#fff'}}>{totalHrs}</td>
        <td style={{...BC,fontSize:11,color:'#94a3b8',fontStyle:'italic',fontWeight:400}}>(non comptab.)</td>
      </tr></tfoot>
    </table>}

function parseExcel(file,onOk,onErr){
  const r=new FileReader();
  r.onload=e=>{try{
    const wb=XLSX.read(e.target.result,{type:'array'});
    const toRows=n=>wb.SheetNames.includes(n)?XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''}):[]; 
    const rawFull=toRows('Liste Prof complet');const rawDef=toRows('Liste_prof_déf');
    // Grouper toutes les nominations par enseignant (gérer lignes avec Abréviation vide = continuation)
    const nomMap={};let lastAbr='';
    rawDef.forEach(r=>{
      const k=String(r['Abréviation']||'').trim()||lastAbr;
      if(!k)return;lastAbr=k;
      if(!nomMap[k])nomMap[k]=[];
      const nom={Ecole:String(r['Ecole']||''),Type:String(r['Type']||'').trim(),'Libellé Fonction':String(r['Libellé Fonction']||'').trim(),Vol:String(r['Vol']||'').trim(),nbreH:String(r['nbreH']||''),Charge:String(r['Charge']||''),'Commentaire Nomination':String(r['Commentaire Nomination']||'').trim(),'Libellé Diplôme ou EU':String(r['Libellé Diplôme ou EU']||'').trim()};
      // Déduplique par Libellé Fonction + Diplôme pour éviter les doublons de diplômes
      const isDup=nomMap[k].some(n=>n['Libellé Fonction']===nom['Libellé Fonction']&&n.Vol===nom.Vol);
      if(!isDup)nomMap[k].push(nom);
    });
    const profs=rawFull.filter(r=>String(r['Abréviation']||'').trim()).map(r=>{
      const ps=String(r['Abréviation']).trim();
      const noms=nomMap[ps]||[];
      const d=noms[0]||{};
      return{_id:uid(),Pseudo:ps,Nom:String(r['Nom Enseignant']||'').trim(),Email:String(r['adresse mail']||'').trim(),
        Ecole:d.Ecole||'',Type:d.Type||'','Libellé Fonction':d['Libellé Fonction']||'',Vol:d.Vol||'',nbreH:d.nbreH||'',Charge:d.Charge||'',
        'Commentaire Nomination':d['Commentaire Nomination']||'','Libellé Diplôme ou EU':d['Libellé Diplôme ou EU']||'',
        nominations:noms};
    });
    const rawCl=toRows('Liste Classes');const classes=rawCl.filter(r=>String(r['CODEClasse']||'').trim()&&!String(r['CODEClasse']).startsWith('X')).map(r=>({_id:uid(),Année:String(r['Année']||'').trim(),GP:String(r['GP']||''),CODEClasse:String(r['CODEClasse']).trim(),'Nom Option':String(r['Nom Option']||'').trim(),'Nbre Elev':String(r['Nbre Elev']||'0')}));
    const rawAttr=toRows('Attributions_par_classe');const attributions=rawAttr.map((r,i)=>({_id:uid(),id:i,Classe:String(r['Classe']||'').trim(),'Libellé long':String(r['Libellé long']||'').trim(),Hrs:sfloat(r['Hrs']),Fonction:String(r['Fonction']||'').trim(),'Code cours':String(r['Code cours']||'').trim(),Abr5:String(r['Abr5']||'').trim(),'Prof Principal':String(r['Prof Principal']||'').trim(),'Pseudo ProfP':String(r['Pseudo ProfP']||'')==='0'?'':String(r['Pseudo ProfP']||'').trim(),"Nbre d'heure attribué":sfloat(r["Nbre d'heure attribué"]),HRGPT:sfloat(r['HRGPT']),CLASRGPT:String(r['CLASRGPT']||'').trim(),'Catégorie heure':normCat(String(r['Catégorie heure']||'').trim()),'PROF REMP':String(r['PROF REMP']||'').trim(),'Pseudo ProfR':String(r['Pseudo ProfR']||'')==='0'?'':String(r['Pseudo ProfR']||'').trim()})).filter(r=>r.Classe||r['Libellé long']);
    const seen=new Set();const courses=attributions.filter(a=>{const k=a['Libellé long'];if(!k||seen.has(k))return false;seen.add(k);return true;}).map(a=>({_id:uid(),'Libellé long':a['Libellé long'],Abr5:a.Abr5,Fonction:a.Fonction,'Code cours':a['Code cours']}));
    const rawN=toRows('NTTP-Cat');const categories=rawN.filter(r=>String(r['Catégorie']||'').trim()).map((r,i)=>({_id:uid(),id:'cat'+String(i+1).padStart(2,'0'),Catégorie:normCat(String(r['Catégorie']).trim()),NTTP:String(r['NTTP']||0),'Prélèvement zonale':String(r['Prélèvement zonale']||0),Total:String(r['Total']||0)}));
    onOk({profs,classes,attributions,courses,categories});
  }catch(err){onErr('Erreur : '+err.message);}};
  r.onerror=()=>onErr('Impossible de lire le fichier.');
  r.readAsArrayBuffer(file);
}
function ImportView({dispatch,setView}){
  const[status,setStatus]=useState('idle');const[errMsg,setErrMsg]=useState('');const[preview,setPreview]=useState(null);const[mode,setMode]=useState('replace');
  const dropRef=useRef(null);const inputRef=useRef(null);
  function handleFile(file){if(!file)return;const ext=file.name.split('.').pop().toLowerCase();if(!['xlsx','xls'].includes(ext)){setErrMsg('Format non supporté. Utilisez .xlsx ou .xls');setStatus('error');return;}setStatus('parsing');parseExcel(file,d=>{setPreview(d);setStatus('preview');},m=>{setErrMsg(m);setStatus('error');});}
  function handleDrop(e){e.preventDefault();dropRef.current.style.borderColor='';handleFile(e.dataTransfer.files[0]);}
  function handleConfirm(){if(!preview)return;dispatch({type:mode==='replace'?'IMPORT_REPLACE':'IMPORT_MERGE',payload:preview});setStatus('done');}

  return <div className="page"><div className="page-header"><div><div className="page-title">Importer un fichier Excel</div><div className="page-subtitle">Mettre à jour les données depuis un fichier .xlsx</div></div></div>
    {status==='done'?<div className="card" style={{textAlign:'center',padding:'42px 20px'}}><div style={{width:52,height:52,borderRadius:'50%',background:'var(--green-light)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}><Icon d={I.check} size={26} style={{color:'var(--green)'}}/></div><h2 style={{fontSize:17,fontWeight:700,marginBottom:7}}>Import réussi !</h2><p style={{color:'var(--gray-500)',marginBottom:20,fontSize:13}}>Données {mode==='replace'?'remplacées':'fusionnées'} avec succès.</p><div style={{display:'flex',gap:8,justifyContent:'center'}}><button className="btn btn-primary" onClick={()=>setView('dashboard')}><Icon d={I.home}/>Tableau de bord</button><button className="btn btn-secondary" onClick={()=>{setStatus('idle');setPreview(null);}}>Importer un autre</button></div></div>
    :status==='preview'&&preview?<>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10,marginBottom:18}}>{[{l:'Enseignants',v:preview.profs.length,c:'var(--blue)'},{l:'Classes',v:preview.classes.length,c:'var(--green)'},{l:'Cours',v:preview.courses.length,c:'var(--purple)'},{l:'Attributions',v:preview.attributions.length,c:'var(--amber)'},{l:'Catégories',v:preview.categories.length,c:'#0891b2'}].map(s=><div key={s.l} className="stat-card" style={{borderTop:`3px solid ${s.c}`,textAlign:'center'}}><div className="stat-value" style={{color:s.c,fontSize:22}}>{s.v}</div><div className="stat-label">{s.l}</div></div>)}</div>
      <div className="card" style={{marginBottom:14}}>
        <h3 style={{fontSize:13,fontWeight:700,marginBottom:12}}>Mode d'import</h3>
        {[{v:'replace',l:'Remplacer toutes les données',d:'Les données actuelles seront entièrement remplacées.'},{v:'merge',l:'Fusionner avec les données existantes',d:'Nouvelles données ajoutées, existants mis à jour, ajouts manuels conservés.'}].map(o=><label key={o.v} style={{display:'flex',alignItems:'flex-start',gap:10,cursor:'pointer',padding:'10px 12px',borderRadius:7,border:`2px solid ${mode===o.v?'var(--blue)':'var(--gray-200)'}`,background:mode===o.v?'var(--blue-light)':'#fff',marginBottom:8}}><input type="radio" name="mode" value={o.v} checked={mode===o.v} onChange={()=>setMode(o.v)} style={{width:'auto',marginTop:2}}/><div><div style={{fontWeight:600,fontSize:12.5}}>{o.l}</div><div style={{fontSize:11.5,color:'var(--gray-500)',marginTop:1}}>{o.d}</div></div></label>)}
      </div>
      {mode==='replace'&&<div className="alert" style={{background:'var(--red-light)',color:'#991b1b',border:'1px solid #fecaca',marginBottom:14,fontSize:12.5}}>⚠ Toutes vos modifications manuelles seront perdues.</div>}
      <div style={{display:'flex',gap:8}}><button className="btn btn-primary" onClick={handleConfirm}><Icon d={I.check}/>Confirmer l'import</button><button className="btn btn-secondary" onClick={()=>{setStatus('idle');setPreview(null);}}>Annuler</button></div>
    </>
    :<>
      {status==='error'&&<div className="alert" style={{background:'var(--red-light)',color:'#991b1b',border:'1px solid #fecaca',marginBottom:14,fontSize:12.5}}><Icon d={I.alert} size={14} style={{verticalAlign:-2,marginRight:5}}/>{errMsg}</div>}
      <div ref={dropRef} style={dStyle} onClick={()=>inputRef.current.click()} onDragOver={e=>{e.preventDefault();dropRef.current.style.borderColor='var(--blue)';dropRef.current.style.background='var(--blue-light)';}} onDragLeave={()=>{dropRef.current.style.borderColor='';dropRef.current.style.background='var(--gray-50)';}} onDrop={handleDrop}>
        <input ref={inputRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
        {status==='parsing'?<><div style={{fontSize:13.5,color:'var(--blue)',fontWeight:600,marginBottom:5}}>Lecture en cours…</div><div style={{fontSize:12,color:'var(--gray-400)'}}>Analyse du fichier Excel</div></>
        :<><div style={{color:'var(--gray-300)',marginBottom:10}}><Icon d={I.upload} size={38}/></div><div style={{fontSize:14,fontWeight:600,color:'var(--gray-700)',marginBottom:5}}>Glissez votre fichier ici</div><div style={{fontSize:12.5,color:'var(--gray-400)',marginBottom:14}}>ou cliquez pour parcourir</div><div style={{display:'inline-block',background:'var(--blue)',color:'#fff',padding:'7px 18px',borderRadius:6,fontSize:12.5,fontWeight:500}}>Choisir un fichier .xlsx</div><div style={{fontSize:10.5,color:'var(--gray-400)',marginTop:12}}>Feuilles requises : <code>Attributions_par_classe</code>, <code>Liste Prof complet</code>, <code>Liste_prof_déf</code>, <code>Liste Classes</code>, <code>NTTP-Cat</code></div></>}
      </div>
    </>}
  </div>;
}

function ExportView({state}){
  const[status,setStatus]=useState('idle');
  function doExport(){
    setStatus('working');
    try{
      const wb=XLSX.utils.book_new();
      // Attributions
      const attrData=state.attributions.map(a=>({'Classe':a.Classe,'Libellé long':a['Libellé long'],'Hrs':a.Hrs,'Fonction':a.Fonction,'Code cours':a['Code cours'],'Abr5':a.Abr5,'Prof Principal':a['Prof Principal'],'Pseudo ProfP':a['Pseudo ProfP'],"Nbre d'heure attribué":a["Nbre d'heure attribué"],'HRGPT':a.HRGPT,'CLASRGPT':a.CLASRGPT,'Catégorie heure':a['Catégorie heure'],'PROF REMP':a['PROF REMP'],'Pseudo ProfR':a['Pseudo ProfR']}));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(attrData),'Attributions_par_classe');
      // Liste Prof complet
      const profData=state.profs.map(p=>({'Abréviation':p.Pseudo,'Nom Enseignant':p.Nom,'adresse mail':p.Email,'Libellé Fonction':p['Libellé Fonction'],'Vol':p.Vol}));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(profData),'Liste Prof complet');
      // Liste_prof_déf
      const profDef=[];state.profs.forEach(p=>{const noms=p.nominations&&p.nominations.length>0?p.nominations:[{Ecole:p.Ecole,Type:p.Type,'Libellé Fonction':p['Libellé Fonction'],Vol:p.Vol,nbreH:p.nbreH,Charge:p.Charge,'Commentaire Nomination':p['Commentaire Nomination'],'Libellé Diplôme ou EU':p['Libellé Diplôme ou EU']}];noms.forEach((n,i)=>profDef.push({'Abréviation':i===0?p.Pseudo:'','Nom Enseignant':i===0?p.Nom:'',Ecole:n.Ecole,Type:n.Type,'Libellé Fonction':n['Libellé Fonction'],Vol:n.Vol,nbreH:n.nbreH,Charge:n.Charge,'Commentaire Nomination':n['Commentaire Nomination'],'Libellé Diplôme ou EU':n['Libellé Diplôme ou EU']}));});
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(profDef),'Liste_prof_déf');
      // Liste Classes
      const classData=state.classes.map(c=>({'Année':c.Année,'GP':c.GP,'CODEClasse':c.CODEClasse,'Nom Option':c['Nom Option'],'Nbre Elev':c['Nbre Elev']}));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(classData),'Liste Classes');
      // NTTP-Cat
      const catData=state.categories.map(c=>({'Catégorie':c.Catégorie,'NTTP':c.NTTP,'Prélèvement zonale':c['Prélèvement zonale'],'Total':c.Total}));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(catData),'NTTP-Cat');
      const dateStr=new Date().toISOString().slice(0,10).replace(/-/g,'');
      XLSX.writeFile(wb,`GestioLys_Attributions_${ANNEE.replace('-','')}_${dateStr}.xlsx`);
      setStatus('done');setTimeout(()=>setStatus('idle'),3000);
    }catch(e){alert('Erreur export : '+e.message);setStatus('idle');}
  }
  return <div className="page">
    <div className="page-header"><div><div className="page-title">Exporter vers Excel</div><div className="page-subtitle">Télécharger toutes les données en fichier .xlsx</div></div></div>
    <div className="card">
      <h3 style={{fontSize:14,fontWeight:700,marginBottom:12}}>Export complet — {ANNEE}</h3>
      <p style={{fontSize:13,color:'var(--gray-600)',marginBottom:16}}>Le fichier exporté contiendra les feuilles suivantes :</p>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:10,marginBottom:20}}>
        {[{n:'Attributions_par_classe',d:`${state.attributions.length} lignes`,c:'var(--amber)'},{n:'Liste Prof complet',d:`${state.profs.length} enseignants`,c:'var(--blue)'},{n:'Liste_prof_déf',d:'Données définitives',c:'var(--blue)'},{n:'Liste Classes',d:`${state.classes.length} classes`,c:'var(--green)'},{n:'NTTP-Cat',d:`${state.categories.length} catégories`,c:'var(--purple)'}].map(s=><div key={s.n} style={{padding:'10px 12px',borderRadius:7,border:`1px solid var(--gray-200)`,borderLeft:`3px solid ${s.c}`}}><div style={{fontWeight:600,fontSize:12,marginBottom:2}}>{s.n}</div><div style={{fontSize:11,color:'var(--gray-500)'}}>{s.d}</div></div>)}
      </div>
      {status==='done'&&<div className="alert alert-blue" style={{marginBottom:14}}>✓ Fichier téléchargé avec succès !</div>}
      <button className="btn btn-success" onClick={doExport} disabled={status==='working'}>
        <Icon d={I.download}/>{status==='working'?'Export en cours…':'Télécharger le fichier .xlsx'}
      </button>
    </div>
  </div>;
}

function DepechesView({state,dispatch,isAdmin}){
  const[tab,setTab]=useState(0);
  const dep=state.depeche||INIT_DEPECHE;
  const ntpp=dep.ntpp||INIT_DEPECHE.ntpp;
  const pop=dep.population||{source:'',date:'',total15jan:0,rows:[]};
  const[editForm,setEditForm]=useState(null);
  const[csvStatus,setCsvStatus]=useState('');
  const csvRef=useRef(null);
  const totalNpp=ntpp.categories.reduce((s,c)=>s+c.npp,0);
  const totalSuppl=ntpp.supplements.reduce((s,c)=>s+c.valeur,0);
  const totalRetraits=ntpp.retraits.reduce((s,r)=>s+r.valeur,0);

  function handleCSV(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const raw=XLSX.utils.sheet_to_json(ws,{defval:''});
        const rows=raw.map(r=>({
          implantation:String(r['Implantation']||''),
          grille:String(r["N° grilles horaire"]||r['N° grille']||''),
          anneeEtude:String(r["Année d'étude"]||r['Annee etude']||''),
          elevesTotal:parseInt(r['Total élèves SIEL'])||0,
          elevesPP:parseInt(r['Total des élèves comptant pour les Périodes Prof SIEL'])||0,
        })).filter(r=>r.implantation&&r.anneeEtude);
        const groupRows=rows.filter(r=>!r.grille||r.grille===''||r.grille==='NaN'||r.grille==='undefined');
        const total=groupRows.filter(r=>r.implantation!=='10201').reduce((s,r)=>s+r.elevesTotal,0);
        const newPop={source:file.name,date:new Date().toLocaleDateString('fr-BE'),total15jan:total,rows};
        dispatch({type:'UPD_DEPECHE',payload:{...dep,population:newPop}});
        setCsvStatus('✓ '+rows.length+' lignes importées depuis '+file.name+' — Total 15/01 : '+total+' élèves');
      }catch(err){setCsvStatus('✗ Erreur: '+err.message);}
    };
    reader.readAsBinaryString(file);e.target.value='';
  }

  function handleNtppPDF(e){
    const file=e.target.files[0];if(!file)return;
    alert('Fichier "'+file.name+'" chargé. Utilisez le bouton "Modifier" pour saisir manuellement les valeurs NTPP de la nouvelle dépêche.');
    e.target.value='';
  }

  function saveEdit(){
    const ef=editForm;
    const newTotal=ef.categories.reduce((s,c)=>s+c.npp,0)+ef.supplements.reduce((s,s2)=>s+s2.valeur,0)-ef.retraits.reduce((s,r)=>s+r.valeur,0);
    dispatch({type:'UPD_DEPECHE',payload:{...dep,ntpp:{...ef,ntppTotal:newTotal}}});
    // Sync categories in state
    const newCats=state.categories.map(c=>{
      const match=ef.categories.find(ec=>c.Catégorie&&c.Catégorie.startsWith('Cat. '+ec.code));
      if(match)return{...c,NTTP:match.npp,Total:match.npp-sint(c['Prélèvement zonale']||0)};
      return c;
    });
    dispatch({type:'SYNC_CATS',payload:newCats});
    setEditForm(null);
  }

  function updCat(code,val){setEditForm(f=>({...f,categories:f.categories.map(c=>c.code===code?{...c,npp:parseInt(val)||0}:c)}));}
  function updSuppl(i,field,val){setEditForm(f=>({...f,supplements:f.supplements.map((s,j)=>j===i?{...s,[field]:field==='valeur'?parseInt(val)||0:val}:s)}));}
  function updRetrait(i,field,val){setEditForm(f=>({...f,retraits:f.retraits.map((r,j)=>j===i?{...r,[field]:field==='valeur'?parseInt(val)||0:val}:r)}));}

  function pushToRlmo(){
    const groupRows=pop.rows.filter(r=>(!r.grille||r.grille===''||r.grille==='NaN'||r.grille==='undefined')&&r.implantation!=='10201');
    if(!groupRows.length)return alert('Aucune donnée population. Importez d\'abord un fichier CSV.');
    const rlmoRows=groupRows.map(r=>({_id:uid(),label:r.anneeEtude+' (impl. '+r.implantation+')',eleves:r.elevesTotal,rel:{cath:r.elevesTotal,mor:0,prot:0,isl:0,isr:0,orth:0},gManuel:null}));
    dispatch({type:'UPD_DEPECHE',payload:{...dep,rlmoRows}});
    alert(rlmoRows.length+' regroupements préparés. Allez dans "Simulateur RLMO" → "Charger population".');
  }

  const ef=editForm;
  const TABS=['Dépêche NTPP','Population scolaire'];
  const implLabels={'2616':'Comines — impl. 2616','2623':'Warneton — impl. 2623','10201':'Alternance — impl. 10201'};
  const ntppRef=useRef(null);

  return <div className="page">
    <div className="page-header">
      <div><div className="page-title">Dépêches FWB</div><div className="page-subtitle">NTPP et population scolaire — importez les nouvelles dépêches chaque année</div></div>
      <div style={{display:'flex',gap:6}}>
        <button className="btn btn-secondary btn-sm" onClick={()=>csvRef.current.click()}><Icon d={I.upload}/>CSV Population</button>
        <button className="btn btn-secondary btn-sm" onClick={()=>ntppRef.current.click()}><Icon d={I.upload}/>PDF NTPP</button>
        <input ref={csvRef} type="file" accept=".csv,.xlsx,.xls" style={{display:'none'}} onChange={handleCSV}/>
        <input ref={ntppRef} type="file" accept=".pdf" style={{display:'none'}} onChange={handleNtppPDF}/>
      </div>
    </div>

    <div className="card no-print" style={{marginBottom:14,padding:'4px 6px'}}>
      <div style={{display:'flex',gap:2}}>{TABS.map((t,i)=><button key={i} onClick={()=>setTab(i)} style={{padding:'7px 16px',borderRadius:5,border:'none',cursor:'pointer',fontWeight:i===tab?700:400,background:i===tab?'#1e293b':'transparent',color:i===tab?'#fff':'var(--gray-600)',fontSize:12.5,transition:'all .15s'}}>{t}</button>)}</div>
    </div>

    {tab===0&&<>
      <div className="card" style={{marginBottom:14,borderLeft:'4px solid #1e293b'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:'#1e293b',marginBottom:6}}>Dépêche NTPP — {ntpp.annee}</div>
            <div style={{fontSize:11.5,color:'var(--gray-500)',lineHeight:1.9}}>
              Réf. : <strong>{ntpp.reference}</strong><br/>
              Générée le : <strong>{ntpp.dateGeneration}</strong> · Gestionnaire FWB : <strong>{ntpp.gestionnaire}</strong>
            </div>
          </div>
          {isAdmin&&<button className="btn btn-secondary btn-sm" onClick={()=>setEditForm({...ntpp,categories:ntpp.categories.map(c=>({...c})),supplements:ntpp.supplements.map(s=>({...s})),retraits:ntpp.retraits.map(r=>({...r}))})}><Icon d={I.edit}/>Modifier / Nouvelle dépêche</button>}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10}}>
          {[['NTPP 15/01 (base)',ntpp.ntppBase15jan,'#1e293b'],['NTPP après minima',ntpp.ntppApresMinima,'#475569'],['Suppléments nets',totalSuppl-totalRetraits,'var(--green)'],['NTPP total organisable',ntpp.ntppTotal,'var(--blue-dark)']].map(([l,v,c])=><div key={l} style={{textAlign:'center',padding:'12px 8px',background:'#f8fafc',borderRadius:8,border:'1px solid var(--gray-200)'}}><div style={{fontSize:24,fontWeight:800,color:c}}>{v}</div><div style={{fontSize:10.5,color:'var(--gray-500)',marginTop:3}}>{l}</div></div>)}
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:14,marginBottom:14}}>
        <div className="card">
          <div style={{fontSize:12.5,fontWeight:700,color:'#1e293b',marginBottom:10}}>NPP par catégorie</div>

              <th style={{padding:'7px 10px',textAlign:'left'}}>Catégorie</th>

            <tbody>

        <div style={{marginTop:12,padding:'8px 10px',background:'var(--blue-light)',borderRadius:6,fontSize:12,color:'var(--blue-dark)'}}><strong>NTPP calculé : </strong>{ef.categories.reduce((s,c)=>s+c.npp,0)+ef.supplements.reduce((s,s2)=>s+s2.valeur,0)-ef.retraits.reduce((s,r)=>s+r.valeur,0)} périodes</div>
      </Modal>}
    </>}

    {tab===1&&<>
      <div className="card" style={{marginBottom:14}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10,marginBottom:10}}>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:'#1e293b',marginBottom:4}}>Population scolaire (15 janvier)</div>

        {csvStatus&&<div style={{padding:'7px 10px',borderRadius:6,background:csvStatus.startsWith('✓')?'#dcfce7':'#fee2e2',color:csvStatus.startsWith('✓')?'#166534':'#991b1b',fontSize:12,marginTop:6}}>{csvStatus}</div>}
        <div style={{marginTop:8,fontSize:11.5,color:'var(--gray-500)'}}>Format attendu : fichier CSV ou Excel de la FWB (colonnes : Implantation, N° grilles horaire, Année d'étude, Total élèves SIEL…)</div>
      </div>

      {pop.rows.length>0&&['2616','2623','10201'].map(impl=>{
        const implRows=pop.rows.filter(r=>r.implantation===impl&&(!r.grille||r.grille===''||r.grille==='NaN'||r.grille==='undefined'));
        if(!implRows.length)return null;

        return <div key={impl} className="card" style={{marginBottom:14,borderLeft:'3px solid '+implColor}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>

          </div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>

            <tbody>{implRows.map((r,i)=><tr key={i} style={{borderBottom:'1px solid var(--gray-100)',background:i%2===0?'#fff':'#f8fafc'}}>
              <td style={{padding:'5px 10px',color:'var(--gray-700)'}}>{r.anneeEtude}</td>
              <td style={{padding:'5px 10px',textAlign:'center',fontWeight:600,color:'#1e293b'}}>{r.elevesTotal}</td>
            </tr>)}
            <tr style={{background:'#1e293b',color:'#fff',fontWeight:700}}>
              <td style={{padding:'6px 10px'}}>TOTAL</td>
              <td style={{padding:'6px 10px',textAlign:'center'}}>{total}</td>
            </tr></tbody>
          </table>
        </div>;
      })}
    </>}
  </div>;
}
// ── SIMULATEUR RLMO ───────────────────────────────────────────────────────────
const RELIGIONS=[{key:'cath',label:'Cath.',color:'#2563eb'},{key:'mor',label:'Morale',color:'#16a34a'},{key:'prot',label:'Prot.',color:'#d97706'},{key:'isl',label:'Islam',color:'#7c3aed'},{key:'isr',label:'Isr.',color:'#0891b2'},{key:'orth',label:'Orth.',color:'#db2777'}];
const RLMO_REF=[
  {label:"1 D1 1C",eleves:53,groupes:3},{label:"1 D1 2C + 1 D1 2S",eleves:62,groupes:3},{label:"1 D1 1D + DASPA",eleves:29,groupes:2},{label:"1 D1 2D + 1 D1 2DS",eleves:37,groupes:3},
  {label:"1 D2 3G + 1 D2 3TT + 1D2 3AT",eleves:20,groupes:1},{label:"1 D2 3TQ + 1 D2 3AQ",eleves:22,groupes:1},{label:"1 D2 3P",eleves:79,groupes:3},
  {label:"1 D2 4G + 1 D2 4TT + 1 D2 4AT + 1 D2 4R TT",eleves:16,groupes:1},{label:"1 D3 5G + 1 D3 5TT + 1 D3 5AT",eleves:21,groupes:1},
  {label:"1 D3 5TQ + 1 D3 5AQ + 1 DQ 5AQ + 1 DQ 5TQ",eleves:21,groupes:1},{label:"1 D3 5P + 1 DQ 5P",eleves:79,groupes:3},
  {label:"1 D3 6G + 1 D3 6TT + 1 D3 6AT",eleves:23,groupes:1},{label:"1 D3 6TQ + 1 D3 6AQ + 1 D3 3C TQ + 1 DQ 6AQ + 1 DQ 6TQ + 1 DQ DFP 6TQ + 1 DQ DFP 6AQ",eleves:20,groupes:1},
  {label:"1 D3 6P + 1 D3 3C P + 1 DQ 6P + 1 DQ DFP 6P",eleves:50,groupes:2},{label:"1 D2 4TQ + 1 D2 4AQ + 1 D2 4R TQ + 1 DQ 4TQ + 1 DQ 4AQ + 1 DQ 4C TQ",eleves:21,groupes:1},
  {label:"1 D2 4P + 1 DQ 4P + 1 DQ 4C P",eleves:48,groupes:2},{label:"1 D3 7TQ + 1 DQ 7TQ + 1 D3 DFP 7TQ",eleves:8,groupes:1},
  {label:"1 D3 7AP + 1 D3 7BP + 1 D3 7CP + 1 D3 DFP 7BP + 1 D3 DFP 7CP",eleves:34,groupes:2},
];
function calcG(eleves,seuil,minE){return eleves<minE?0:Math.ceil(eleves/seuil);}
function makeRow(label='',eleves=0){const rel={};RELIGIONS.forEach(r=>rel[r.key]=0);rel.cath=eleves;return{_id:uid(),label,eleves,rel,gManuel:null};}
function makeRefRows(){return RLMO_REF.map(r=>({_id:uid(),label:r.label,eleves:r.eleves,rel:{cath:r.eleves,mor:0,prot:0,isl:0,isr:0,orth:0},gManuel:r.groupes}));}
function RLMOSimulateurView({state,dispatch}){
  const[rows,setRows]=useState(makeRefRows);
  const[seuil,setSeuil]=useState(25);const[minE,setMinE]=useState(8);const[coeff,setCoeff]=useState(0.98);
  const[periodes,setPeriodes]=useState(2);const[disp,setDisp]=useState(0);const[showRel,setShowRel]=useState(false);
  const[saveMsg,setSaveMsg]=useState('');
  const totalE=rows.reduce((s,r)=>s+sint(r.eleves),0);
  const totalG=rows.reduce((s,r)=>s+(r.gManuel!==null?sint(r.gManuel):calcG(sint(r.eleves),seuil,minE)),0);
  const elElig=totalE-sint(disp);const rlmoBrut=totalG*periodes*coeff;const rlmoFinal=Math.floor(rlmoBrut);
  function updRow(id,f,v){setRows(r=>r.map(x=>{if(x._id!==id)return x;const u={...x,[f]:v};if(f==='eleves'){const os=Object.entries(u.rel).filter(([k])=>k!=='cath').reduce((s,[,v])=>s+sint(v),0);if(os===0)u.rel={...u.rel,cath:sint(v)};}return u;}));}
  function updRel(id,k,v){setRows(r=>r.map(x=>{if(x._id!==id)return x;const rel={...x.rel,[k]:sint(v)};return{...x,rel,eleves:Object.values(rel).reduce((s,v)=>s+sint(v),0)};}));}
  function setG(id,v){setRows(r=>r.map(x=>x._id===id?{...x,gManuel:v===''?null:sint(v)}:x));}
  const BH={padding:'7px 9px',background:'#1e293b',color:'#fff',fontWeight:600,fontSize:11.5,border:'1px solid #334155'};
  const BHC={...BH,textAlign:'center'};

  const BL={...BC,textAlign:'left'};
  return <div className="page">
    <div className="page-header no-print"><div><div className="page-title">Simulateur RLMO</div><div className="page-subtitle">Religion / Laïque — Calcul des périodes organisables (AR n°49 — FWB)</div></div>
    <div style={{display:'flex',gap:7,flexWrap:'wrap',alignItems:'center'}}>
      {state&&state.depeche&&state.depeche.rlmoRows&&state.depeche.rlmoRows.length>0&&<button className="btn btn-primary btn-sm" onClick={()=>{const anneeRef=state.depeche.rlmoAnnee||'?';if(window.confirm('Charger les '+state.depeche.rlmoRows.length+' regroupements de la dépêche '+anneeRef+' ?'))setRows(state.depeche.rlmoRows.map(r=>({...r,_id:uid()})));}}><Icon d={I.upload}/>Charger dépêche {state.depeche&&state.depeche.rlmoAnnee||''}</button>}
      <button className="btn btn-secondary btn-sm" onClick={()=>{if(window.confirm('Charger les données de référence dépêche 2025-2026 (32 groupes) ?')){setRows(makeRefRows());}}}><Icon d={I.download}/>Référence 2025-2026</button>
      <button className="btn btn-success btn-sm" onClick={()=>{if(dispatch&&window.confirm('Enregistrer ces '+rows.length+' regroupements comme données RLMO de référence pour '+ANNEE+' ?')){dispatch({type:'UPD_RLMO_REF',payload:{rows:rows.map(r=>({...r})),annee:ANNEE}});setSaveMsg('Enregistré ✓');setTimeout(()=>setSaveMsg(''),3000);}}}><Icon d={I.check}/>Enregistrer comme réf. {ANNEE}</button>
      {saveMsg&&<span style={{color:'var(--green)',fontSize:11.5,fontWeight:600}}>{saveMsg}</span>}
      <button className="btn btn-secondary btn-sm" onClick={()=>window.print()}><Icon d={I.printer}/>Imprimer</button>
      <button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>{if(window.confirm('Réinitialiser le simulateur ?')){setRows([makeRow()]);setDisp(0);}}}>Réinitialiser</button>
    </div></div>
    <div className="card no-print" style={{marginBottom:14}}><div style={{fontSize:12.5,fontWeight:700,marginBottom:10,color:'var(--gray-700)'}}>Paramètres du calcul</div>

        {[['Seuil dédoublmt.',seuil,v=>setSeuil(v),5,50],['Min élèves/grp',minE,v=>setMinE(v),1,20],['Périodes/groupe',periodes,v=>setPeriodes(v),1,4],['Élèves dispensés',disp,v=>setDisp(v),0,9999]].map(([l,v,s,mn,mx])=><div key={l} className="form-group" style={{marginBottom:0,minWidth:140}}><label>{l}</label><input type="number" value={v} min={mn} max={mx} onChange={e=>s(sint(e.target.value)||0)} style={{width:80}}/></div>)}
        <div className="form-group" style={{marginBottom:0,minWidth:140}}><label>Coefficient</label><input type="number" value={coeff} min={0.5} max={1} step={0.01} onChange={e=>setCoeff(parseFloat(e.target.value)||0.98)} style={{width:80}}/></div>
      </div>
    </div>
    <div className="card" style={{marginBottom:14,borderLeft:'4px solid #1e293b'}}>
      <div style={{fontSize:13,fontWeight:700,color:'#1e293b',marginBottom:10}}>I. Résumé du calcul RLMO</div>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12.5}}>
        <tbody>
          {[['Nombre total d\'élèves au 1er octobre',totalE],['Élèves pris en compte',elElig],['Élèves dispensés RLMO',sint(disp)],['TOTAL groupes',<strong style={{color:'#1e293b',fontSize:14}}>{totalG}</strong>],[`${totalG} groupes × ${periodes} périodes × ${coeff}`,<strong style={{color:rlmoFinal>0?'var(--green)':'var(--red)',fontSize:16}}>{rlmoFinal}</strong>]].map(([l,v],i)=><tr key={i} style={{background:i===4?'#f0fdf4':i%2===0?'#f8fafc':'#fff'}}><td style={{padding:'9px 11px',borderBottom:'1px solid var(--gray-200)',color:'var(--gray-700)'}}>{l}</td><td style={{padding:'9px 11px',borderBottom:'1px solid var(--gray-200)',textAlign:'right',fontWeight:600,minWidth:70}}>{v}</td></tr>)}
        </tbody>
      </table>
      <div style={{marginTop:10,fontSize:11.5,color:'var(--gray-500)'}}>Formule (AR n°49 art. 12-13) : <code style={{background:'var(--gray-100)',padding:'2px 5px',borderRadius:3}}>{totalG} groupe{totalG>1?'s':''} × {periodes} périodes × {coeff} = {rlmoBrut.toFixed(2)} → <strong>{rlmoFinal}</strong> périodes RLMO</code></div>
      {state&&state.depeche&&state.depeche.rlmoAnnee?<div style={{marginTop:8,fontSize:11,color:'var(--green)',padding:'6px 10px',background:'var(--green-light)',borderRadius:6,border:'1px solid #bbf7d0'}}>✓ Données enregistrées — Dépêche {state.depeche.rlmoAnnee} ({state.depeche.rlmoRows&&state.depeche.rlmoRows.length||0} regroupements). Chargez la dépêche {ANNEE} dès réception.</div>:<div style={{marginTop:8,fontSize:11,color:'var(--amber)',padding:'6px 10px',background:'var(--amber-light)',borderRadius:6}}>⚠ Référence 2025-2026 : dépêche FWB = <strong>32 groupes × 2 × 0,98 = 62 périodes RLMO</strong>. Chargez la dépêche 2026-2027 dès réception et cliquez « Enregistrer comme réf. ».</div>}
    </div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div style={{fontSize:13,fontWeight:700,color:'#1e293b'}}>II. Détail par regroupement</div>
        <div style={{display:'flex',gap:7}}><button className="btn btn-ghost btn-sm no-print" onClick={()=>setShowRel(s=>!s)}>{showRel?'▲ Masquer':'▼'} religions</button><button className="btn btn-primary btn-sm no-print" onClick={()=>setRows(r=>[...r,makeRow()])}><Icon d={I.plus}/>Ajouter</button></div>
      </div>

          <th style={BHC}>G calculés</th><th style={{...BHC,background:'#334155'}}>G retenus</th>

        </tr></thead>
        <tbody>{rows.map((row,i)=>{
          const e=sint(row.eleves);const gC=calcG(e,seuil,minE);const gR=row.gManuel!==null?sint(row.gManuel):gC;const manuel=row.gManuel!==null;
          return <tr key={row._id} style={{background:i%2===0?'#fff':'#f8fafc'}}>

            <td style={BC}><input type="number" value={row.eleves} min={0} onChange={ev=>updRow(row._id,'eleves',ev.target.value)} style={{border:'none',background:'transparent',width:50,textAlign:'center',fontSize:13,fontWeight:600,outline:'none'}}/></td>
            {showRel&&RELIGIONS.map(r=><td key={r.key} style={BC}><input type="number" value={row.rel[r.key]||0} min={0} onChange={ev=>updRel(row._id,r.key,ev.target.value)} style={{border:'none',background:'transparent',width:38,textAlign:'center',fontSize:11,outline:'none',color:r.color}}/></td>)}
            <td style={{...BC,color:manuel?'var(--gray-300)':'var(--gray-700)',textDecoration:manuel?'line-through':'none'}}>{gC}</td>
            <td style={{...BC,fontWeight:700,color:manuel?'var(--blue)':'var(--gray-800)'}}><div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:3}}><input type="number" value={row.gManuel!==null?row.gManuel:''} placeholder={String(gC)} min={0} max={20} onChange={ev=>setG(row._id,ev.target.value)} style={{width:38,textAlign:'center',border:'1px solid',borderColor:manuel?'var(--blue)':'var(--gray-300)',borderRadius:4,padding:'2px 3px',fontSize:12,background:manuel?'var(--blue-light)':'#fff'}}/>{manuel&&<button onClick={()=>setG(row._id,'')} style={{background:'none',border:'none',cursor:'pointer',color:'var(--gray-300)',fontSize:11}}>✕</button>}</div></td>
            <td style={BC} className="no-print"><button className="btn btn-ghost btn-sm" style={{color:'var(--red)',padding:'2px 5px'}} onClick={()=>setRows(r=>r.filter(x=>x._id!==row._id))}><Icon d={I.trash} size={12}/></button></td>

        <tfoot><tr style={{background:'#1e293b',color:'#fff',fontWeight:700}}>

          {showRel&&RELIGIONS.map(r=><td key={r.key} style={{...BC,color:r.color,fontSize:11,border:'none'}}>{rows.reduce((s,x)=>s+sint(x.rel[r.key]),0)||''}</td>)}

          <td style={{...BC,color:'#4ade80',fontSize:16,border:'none',background:'rgba(255,255,255,.05)'}}>{totalG}</td>
          <td className="no-print" style={{border:'none'}}/>
        </tr></tfoot>
